<script>
(function() {
  'use strict';

  // ── Fix PiCanvas tab container to allow full-height layout ──
  var root = document.querySelector('.piadmin-root');
  if (root) {
    var p = root.parentElement;
    while (p && p !== document.body) {
      var cls = p.className || '';
      if (cls.indexOf('picanvas-tab-content') > -1 || cls.indexOf('addui-Tabs-content') > -1) {
        p.style.overflow = 'visible';
        p.style.contain = 'none';
        p.style.padding = '0';
      }
      if (cls.indexOf('addui-Tabs-contentHolder') > -1) {
        p.style.overflow = 'visible';
      }
      // Hide the PiCanvas tab bar since admin has its own header
      if (cls.indexOf('addui-Tabs') > -1 && cls.indexOf('addui-Tabs-') === -1) {
        var tabRow = p.querySelector('.addui-Tabs-row');
        if (tabRow) tabRow.style.display = 'none';
      }
      p = p.parentElement;
    }
  }

  // ── Site URL detection ──
  var siteUrl = '';
  if (window._spPageContextInfo && window._spPageContextInfo.webAbsoluteUrl) {
    siteUrl = window._spPageContextInfo.webAbsoluteUrl.replace(/\/$/, '');
  } else {
    var m = window.location.href.match(/^(https?:\/\/[^\/]+\/(?:teams|sites)\/[^\/]+)/i);
    if (m) siteUrl = m[1];
  }

  var LIST_TITLE = 'PiCanvasNavigation';
  var SELECT_FIELDS = 'Id,Title,NavUrl,ParentId0,SortOrder,IsNew,Icon,OpenInNewWindow,Audience,IsEnabled';

  // ═══════════════════════════════════════════════════
  // ApiService — SharePoint REST CRUD
  // ═══════════════════════════════════════════════════
  function ApiService(url) {
    this._url = url;
    this._digest = '';
    this._digestExpiry = 0;
  }

  ApiService.prototype.getDigest = function() {
    var self = this;
    if (self._digest && Date.now() < self._digestExpiry) return Promise.resolve(self._digest);
    var el = document.getElementById('__REQUESTDIGEST');
    if (el && el.value) {
      self._digest = el.value;
      self._digestExpiry = Date.now() + 25 * 60000;
      return Promise.resolve(self._digest);
    }
    return fetch(self._url + '/_api/contextinfo', {
      method: 'POST',
      headers: { 'Accept': 'application/json;odata=nometadata' },
      credentials: 'same-origin'
    }).then(function(r) { return r.json(); }).then(function(d) {
      self._digest = d.FormDigestValue;
      self._digestExpiry = Date.now() + 25 * 60000;
      return self._digest;
    });
  };

  ApiService.prototype.getItems = function() {
    var url = this._url + "/_api/web/lists/getbytitle('" + LIST_TITLE + "')/items" +
      '?$select=' + SELECT_FIELDS + '&$orderby=SortOrder,Id&$top=500';
    return fetch(url, {
      headers: { 'Accept': 'application/json;odata=nometadata' },
      credentials: 'same-origin'
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d) { return d.value || []; });
  };

  ApiService.prototype.createItem = function(data) {
    var self = this;
    return self.getDigest().then(function(digest) {
      return fetch(self._url + "/_api/web/lists/getbytitle('" + LIST_TITLE + "')/items", {
        method: 'POST',
        headers: {
          'Accept': 'application/json;odata=nometadata',
          'Content-Type': 'application/json;odata=nometadata',
          'X-RequestDigest': digest
        },
        credentials: 'same-origin',
        body: JSON.stringify(data)
      });
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  };

  ApiService.prototype.updateItem = function(id, data) {
    var self = this;
    return self.getDigest().then(function(digest) {
      return fetch(self._url + "/_api/web/lists/getbytitle('" + LIST_TITLE + "')/items(" + id + ")", {
        method: 'POST',
        headers: {
          'Accept': 'application/json;odata=nometadata',
          'Content-Type': 'application/json;odata=nometadata',
          'X-RequestDigest': digest,
          'X-HTTP-Method': 'MERGE',
          'If-Match': '*'
        },
        credentials: 'same-origin',
        body: JSON.stringify(data)
      });
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
    });
  };

  ApiService.prototype.deleteItem = function(id) {
    var self = this;
    return self.getDigest().then(function(digest) {
      return fetch(self._url + "/_api/web/lists/getbytitle('" + LIST_TITLE + "')/items(" + id + ")", {
        method: 'POST',
        headers: {
          'Accept': 'application/json;odata=nometadata',
          'X-RequestDigest': digest,
          'X-HTTP-Method': 'DELETE',
          'If-Match': '*'
        },
        credentials: 'same-origin'
      });
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
    });
  };

  // ── Site Assets snapshot file operations ──
  var SNAPSHOT_FILE = 'PiCanvasNavBackup.json';
  var SNAPSHOT_FOLDER = 'SiteAssets';
  var siteRelativeUrl = '';
  if (window._spPageContextInfo && window._spPageContextInfo.webServerRelativeUrl) {
    siteRelativeUrl = window._spPageContextInfo.webServerRelativeUrl.replace(/\/$/, '');
  } else {
    try { siteRelativeUrl = new URL(siteUrl).pathname.replace(/\/$/, ''); } catch(e) {}
  }

  ApiService.prototype.uploadSnapshot = function(jsonString) {
    var self = this;
    var url = self._url + "/_api/web/GetFolderByServerRelativeUrl('" + SNAPSHOT_FOLDER + "')" +
      "/Files/add(url='" + SNAPSHOT_FILE + "',overwrite=true)";
    return self.getDigest().then(function(digest) {
      return fetch(url, {
        method: 'POST',
        headers: {
          'Accept': 'application/json;odata=nometadata',
          'X-RequestDigest': digest
        },
        credentials: 'same-origin',
        body: jsonString
      });
    }).then(function(r) {
      if (!r.ok) throw new Error('Snapshot upload HTTP ' + r.status);
    });
  };

  ApiService.prototype.getSnapshotVersions = function() {
    var filePath = siteRelativeUrl + '/' + SNAPSHOT_FOLDER + '/' + SNAPSHOT_FILE;
    var url = this._url + "/_api/web/GetFileByServerRelativeUrl('" + filePath + "')/Versions" +
      '?$select=VersionId,VersionLabel,Created,CreatedBy/Title&$expand=CreatedBy&$orderby=Created desc&$top=20';
    return fetch(url, {
      headers: { 'Accept': 'application/json;odata=nometadata' },
      credentials: 'same-origin'
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d) { return d.value || []; });
  };

  ApiService.prototype.getSnapshotVersionContent = function(versionId) {
    var filePath = siteRelativeUrl + '/' + SNAPSHOT_FOLDER + '/' + SNAPSHOT_FILE;
    var url = this._url + "/_api/web/GetFileByServerRelativeUrl('" + filePath + "')/Versions(" + versionId + ')/$value';
    return fetch(url, { credentials: 'same-origin' }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  };

  ApiService.prototype.getLatestSnapshot = function() {
    var url = this._url + '/' + SNAPSHOT_FOLDER + '/' + SNAPSHOT_FILE + '?nocache=' + Date.now();
    return fetch(url, { credentials: 'same-origin' }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  };

  // ═══════════════════════════════════════════════════
  // DiffEngine — Field-level comparison & rendering
  // ═══════════════════════════════════════════════════
  var DiffEngine = {
    FIELD_LABELS: {
      Title: 'Title', NavUrl: 'URL', ParentId0: 'Parent', SortOrder: 'Sort Order',
      Icon: 'Icon', IsNew: 'NEW Badge', IsEnabled: 'Enabled',
      OpenInNewWindow: 'New Window', Audience: 'Audience'
    },
    TRACKED_FIELDS: ['Title', 'NavUrl', 'ParentId0', 'SortOrder', 'Icon', 'IsNew', 'IsEnabled', 'OpenInNewWindow', 'Audience'],

    formatValue: function(field, value, itemMap) {
      if (field === 'ParentId0') {
        if (!value || value === 0) return 'Root';
        if (itemMap && itemMap[value]) return itemMap[value].Title || 'Item #' + value;
        return 'Item #' + value;
      }
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      if (value === null || value === undefined || value === '') return '(empty)';
      if (field === 'NavUrl' && value === '#') return '# (header)';
      return String(value);
    },

    diffItem: function(baseline, pending, baselineMap, pendingMap) {
      if (!baseline || !pending) return [];
      var diffs = [];
      for (var i = 0; i < this.TRACKED_FIELDS.length; i++) {
        var f = this.TRACKED_FIELDS[i];
        var ov = baseline[f], nv = pending[f];
        var changed = false;
        if (typeof ov === 'boolean' || typeof nv === 'boolean') {
          changed = (!!ov) !== (!!nv);
        } else if (f === 'ParentId0' || f === 'SortOrder') {
          changed = (ov || 0) !== (nv || 0);
        } else {
          changed = (ov || '') !== (nv || '');
        }
        if (changed) {
          diffs.push({
            field: f,
            label: this.FIELD_LABELS[f] || f,
            oldValue: ov,
            newValue: nv,
            oldDisplay: this.formatValue(f, ov, baselineMap),
            newDisplay: this.formatValue(f, nv, pendingMap)
          });
        }
      }
      return diffs;
    },

    renderFieldDiff: function(diffs) {
      if (!diffs || !diffs.length) return '';
      var html = '';
      for (var i = 0; i < diffs.length; i++) {
        var d = diffs[i];
        html += '<div class="piadmin-diff-row">' +
          '<span class="piadmin-diff-label">' + esc(d.label) + '</span>' +
          '<span class="piadmin-diff-old">' + esc(d.oldDisplay) + '</span>' +
          '<span class="piadmin-diff-arrow">&#8594;</span>' +
          '<span class="piadmin-diff-new">' + esc(d.newDisplay) + '</span>' +
          '</div>';
      }
      return html;
    },

    renderReviewItem: function(item, changeType, diffs) {
      var badgeClass = 'piadmin-review-badge piadmin-review-badge--' + changeType;
      var badgeText = changeType === 'create' ? 'Created' : changeType === 'delete' ? 'Deleted'
        : changeType === 'move' ? 'Moved' : 'Updated';
      var html = '<div class="piadmin-review-item" data-review-id="' + item.Id + '">' +
        '<div class="piadmin-review-item-header">' +
          '<strong>' + esc(item.Title || 'Untitled') + '</strong>' +
          '<span class="' + badgeClass + '">' + badgeText + '</span>' +
          '<button class="piadmin-revert-btn" data-revert-id="' + item.Id + '">Revert</button>' +
        '</div>';
      if (diffs && diffs.length) {
        html += '<div class="piadmin-review-item-diffs">' + this.renderFieldDiff(diffs) + '</div>';
      }
      html += '</div>';
      return html;
    }
  };

  // ═══════════════════════════════════════════════════
  // Session Recovery — localStorage backup
  // ═══════════════════════════════════════════════════
  var SESSION_KEY = 'piadmin_session_' + siteUrl;

  function saveSessionRecovery(items) {
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ timestamp: Date.now(), items: items }));
    } catch(e) { /* quota exceeded — ignore silently */ }
  }

  function getSessionRecovery() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      // Expire after 24 hours
      if (data.timestamp && (Date.now() - data.timestamp) > 86400000) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
      return data;
    } catch(e) { return null; }
  }

  function clearSessionRecovery() {
    try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  }

  // ═══════════════════════════════════════════════════
  // ChangeTracker — Batch edits with undo/redo
  // ═══════════════════════════════════════════════════
  function ChangeTracker() {
    this._baseline = [];
    this._baselineMap = {};
    this._pendingItems = [];
    this._pendingMap = {};
    this._changes = {};       // { id: { type:'create'|'update'|'delete', original:{}, fields:{} } }
    this._undoStack = [];
    this._redoStack = [];
    this._compoundOps = null; // when non-null, collecting ops for compound undo
    this._compoundDesc = '';
    this._nextTempId = -1;
    this._maxUndo = 50;
    this._onChange = null;    // callback
  }

  ChangeTracker.prototype.init = function(items) {
    this._baseline = JSON.parse(JSON.stringify(items));
    this._baselineMap = {};
    for (var i = 0; i < this._baseline.length; i++) {
      this._baselineMap[this._baseline[i].Id] = this._baseline[i];
    }
    this._pendingItems = JSON.parse(JSON.stringify(items));
    this._pendingMap = {};
    for (var i = 0; i < this._pendingItems.length; i++) {
      this._pendingMap[this._pendingItems[i].Id] = this._pendingItems[i];
    }
    this._changes = {};
    this._undoStack = [];
    this._redoStack = [];
    this._nextTempId = -1;
    this._fire();
  };

  ChangeTracker.prototype._fire = function() {
    if (this._onChange) this._onChange();
  };

  ChangeTracker.prototype.isDirty = function() {
    return Object.keys(this._changes).length > 0;
  };

  ChangeTracker.prototype.getChangeCount = function() {
    return Object.keys(this._changes).length;
  };

  ChangeTracker.prototype.getChangeType = function(id) {
    var c = this._changes[id];
    return c ? c.type : null;
  };

  ChangeTracker.prototype.getChangedFields = function(id) {
    var c = this._changes[id];
    return c ? c.fields || {} : {};
  };

  ChangeTracker.prototype.getPendingItems = function() {
    return this._pendingItems;
  };

  ChangeTracker.prototype.getPendingMap = function() {
    return this._pendingMap;
  };

  ChangeTracker.prototype.canUndo = function() { return this._undoStack.length > 0; };
  ChangeTracker.prototype.canRedo = function() { return this._redoStack.length > 0; };

  ChangeTracker.prototype._valuesEqual = function(key, a, b) {
    var boolKeys = { IsNew: 1, IsEnabled: 1, OpenInNewWindow: 1 };
    if (boolKeys[key]) return (!!a) === (!!b);
    if (key === 'ParentId0' || key === 'SortOrder') return (a || 0) === (b || 0);
    return (a || '') === (b || '');
  };

  // ── Push undo entry ──
  ChangeTracker.prototype._pushUndo = function(entry) {
    if (this._compoundOps !== null) {
      // Collecting into compound — merge ops
      for (var i = 0; i < entry.operations.length; i++) {
        this._compoundOps.push(entry.operations[i]);
      }
      return;
    }
    this._undoStack.push(entry);
    if (this._undoStack.length > this._maxUndo) this._undoStack.shift();
    this._redoStack = [];
  };

  // ── Compound undo (for bulk ops) ──
  ChangeTracker.prototype.beginCompound = function(desc) {
    this._compoundOps = [];
    this._compoundDesc = desc || 'Bulk action';
  };

  ChangeTracker.prototype.endCompound = function() {
    if (this._compoundOps && this._compoundOps.length > 0) {
      this._undoStack.push({
        description: this._compoundDesc,
        operations: this._compoundOps
      });
      if (this._undoStack.length > this._maxUndo) this._undoStack.shift();
      this._redoStack = [];
    }
    this._compoundOps = null;
    this._compoundDesc = '';
    this._fire();
  };

  // ── Record an update ──
  ChangeTracker.prototype.recordUpdate = function(id, fields) {
    var item = this._pendingMap[id];
    if (!item) return;
    var original = {};
    var after = {};
    var changedFieldNames = {};
    for (var key in fields) {
      if (!fields.hasOwnProperty(key)) continue;
      original[key] = item[key];
      after[key] = fields[key];
      item[key] = fields[key];
      changedFieldNames[key] = true;
    }

    // Update change entry
    var existing = this._changes[id];
    if (existing && existing.type === 'create') {
      // Still a create — just update the pending item, no separate update entry needed
    } else {
      // Check if item matches baseline now
      var bl = this._baselineMap[id];
      if (bl) {
        var stillDirty = false;
        var allFields = existing ? Object.assign({}, existing.fields || {}, changedFieldNames) : changedFieldNames;
        for (var k in allFields) {
          if (!this._valuesEqual(k, item[k], bl[k])) { stillDirty = true; break; }
        }
        if (stillDirty) {
          // Determine if this is a move (ParentId0 changed from baseline)
          var isMove = !this._valuesEqual('ParentId0', item.ParentId0, bl.ParentId0);
          this._changes[id] = {
            type: isMove ? 'move' : 'update',
            original: existing ? existing.original : original,
            fields: allFields
          };
        } else {
          delete this._changes[id];
        }
      } else {
        // Item not in baseline (shouldn't happen for updates on real items)
        this._changes[id] = { type: 'update', original: original, fields: changedFieldNames };
      }
    }

    this._pushUndo({
      description: 'Edit "' + item.Title + '"',
      operations: [{ type: 'update', itemId: id, before: original, after: after }]
    });
    this._fire();
  };

  // ── Record a move (special update) ──
  ChangeTracker.prototype.recordMove = function(id, newParentId, newSortOrder) {
    var item = this._pendingMap[id];
    if (!item) return;
    var oldTitle = item.Title;
    var parentTitle = newParentId && this._pendingMap[newParentId] ? this._pendingMap[newParentId].Title : 'Root';
    this.recordUpdate(id, { ParentId0: newParentId, SortOrder: newSortOrder });
    // Override the undo description for clarity
    if (this._undoStack.length > 0 && !this._compoundOps) {
      this._undoStack[this._undoStack.length - 1].description = 'Move "' + oldTitle + '" under "' + parentTitle + '"';
    }
    // Ensure it's tagged as move
    if (this._changes[id]) this._changes[id].type = 'move';
  };

  // ── Record a create ──
  ChangeTracker.prototype.recordCreate = function(data) {
    var tempId = this._nextTempId--;
    var item = Object.assign({}, data, { Id: tempId });
    this._pendingItems.push(item);
    this._pendingMap[tempId] = item;
    this._changes[tempId] = { type: 'create', original: null, fields: {} };

    this._pushUndo({
      description: 'Create "' + data.Title + '"',
      operations: [{ type: 'create', itemId: tempId, before: null, after: JSON.parse(JSON.stringify(item)) }]
    });
    this._fire();
    return tempId;
  };

  // ── Record a delete (with cascade) ──
  ChangeTracker.prototype.recordDelete = function(id) {
    var item = this._pendingMap[id];
    if (!item) return;

    // Gather descendants
    var toDelete = [id];
    var queue = [id];
    while (queue.length) {
      var pid = queue.shift();
      for (var i = 0; i < this._pendingItems.length; i++) {
        if (this._pendingItems[i].ParentId0 === pid && toDelete.indexOf(this._pendingItems[i].Id) === -1) {
          toDelete.push(this._pendingItems[i].Id);
          queue.push(this._pendingItems[i].Id);
        }
      }
    }

    var ops = [];
    // Delete in reverse order (children first for proper undo)
    for (var d = toDelete.length - 1; d >= 0; d--) {
      var did = toDelete[d];
      var ditem = this._pendingMap[did];
      if (!ditem) continue;
      ops.push({ type: 'delete', itemId: did, before: JSON.parse(JSON.stringify(ditem)), after: null });

      // If it was a pending create, just annihilate
      if (this._changes[did] && this._changes[did].type === 'create') {
        delete this._changes[did];
      } else {
        this._changes[did] = { type: 'delete', original: JSON.parse(JSON.stringify(ditem)), fields: {} };
      }
      // Remove from pending
      this._pendingItems = this._pendingItems.filter(function(it) { return it.Id !== did; });
      delete this._pendingMap[did];
    }

    this._pushUndo({
      description: 'Delete "' + item.Title + '"' + (toDelete.length > 1 ? ' (+' + (toDelete.length - 1) + ' children)' : ''),
      operations: ops
    });
    this._fire();
  };

  // ── Undo ──
  ChangeTracker.prototype.undo = function() {
    if (!this._undoStack.length) return;
    var entry = this._undoStack.pop();
    // Reverse operations in reverse order
    for (var i = entry.operations.length - 1; i >= 0; i--) {
      this._reverseOp(entry.operations[i]);
    }
    this._redoStack.push(entry);
    this._rebuildChanges();
    this._fire();
  };

  // ── Redo ──
  ChangeTracker.prototype.redo = function() {
    if (!this._redoStack.length) return;
    var entry = this._redoStack.pop();
    // Apply operations in forward order
    for (var i = 0; i < entry.operations.length; i++) {
      this._applyOp(entry.operations[i]);
    }
    this._undoStack.push(entry);
    this._rebuildChanges();
    this._fire();
  };

  ChangeTracker.prototype._reverseOp = function(op) {
    if (op.type === 'update') {
      var item = this._pendingMap[op.itemId];
      if (item && op.before) {
        for (var k in op.before) item[k] = op.before[k];
      }
    } else if (op.type === 'create') {
      // Undo create = remove item
      this._pendingItems = this._pendingItems.filter(function(it) { return it.Id !== op.itemId; });
      delete this._pendingMap[op.itemId];
    } else if (op.type === 'delete') {
      // Undo delete = restore item
      if (op.before) {
        var restored = JSON.parse(JSON.stringify(op.before));
        this._pendingItems.push(restored);
        this._pendingMap[restored.Id] = restored;
      }
    }
  };

  ChangeTracker.prototype._applyOp = function(op) {
    if (op.type === 'update') {
      var item = this._pendingMap[op.itemId];
      if (item && op.after) {
        for (var k in op.after) item[k] = op.after[k];
      }
    } else if (op.type === 'create') {
      if (op.after) {
        var newItem = JSON.parse(JSON.stringify(op.after));
        this._pendingItems.push(newItem);
        this._pendingMap[newItem.Id] = newItem;
      }
    } else if (op.type === 'delete') {
      this._pendingItems = this._pendingItems.filter(function(it) { return it.Id !== op.itemId; });
      delete this._pendingMap[op.itemId];
    }
  };

  // ── Rebuild _changes from diff of pending vs baseline ──
  ChangeTracker.prototype._rebuildChanges = function() {
    this._changes = {};
    var blMap = this._baselineMap;
    var pMap = this._pendingMap;

    // Check for updates and moves
    for (var id in pMap) {
      if (!pMap.hasOwnProperty(id)) continue;
      var numId = parseInt(id);
      if (numId < 0) {
        // Temp ID = pending create
        this._changes[id] = { type: 'create', original: null, fields: {} };
        continue;
      }
      var bl = blMap[id];
      if (!bl) {
        this._changes[id] = { type: 'create', original: null, fields: {} };
        continue;
      }
      var item = pMap[id];
      var diffs = {};
      var hasDiff = false;
      var isMove = false;
      var keys = ['Title', 'NavUrl', 'ParentId0', 'SortOrder', 'Icon', 'IsNew', 'IsEnabled', 'OpenInNewWindow', 'Audience'];
      for (var k = 0; k < keys.length; k++) {
        var key = keys[k];
        if (!this._valuesEqual(key, item[key], bl[key])) {
          diffs[key] = true;
          hasDiff = true;
          if (key === 'ParentId0') isMove = true;
        }
      }
      if (hasDiff) {
        this._changes[id] = { type: isMove ? 'move' : 'update', original: bl, fields: diffs };
      }
    }

    // Check for deletes (in baseline but not in pending)
    for (var bid in blMap) {
      if (!blMap.hasOwnProperty(bid)) continue;
      if (!pMap[bid]) {
        this._changes[bid] = { type: 'delete', original: blMap[bid], fields: {} };
      }
    }
  };

  // ── Get change list for UI ──
  ChangeTracker.prototype.getChangeList = function() {
    var list = [];
    for (var id in this._changes) {
      if (!this._changes.hasOwnProperty(id)) continue;
      var c = this._changes[id];
      var title = '';
      var desc = '';
      if (c.type === 'delete') {
        title = c.original ? c.original.Title : 'Item #' + id;
        desc = 'Deleted';
      } else if (c.type === 'create') {
        var item = this._pendingMap[id];
        title = item ? item.Title : 'New item';
        desc = 'Created';
      } else if (c.type === 'move') {
        var item = this._pendingMap[id];
        title = item ? item.Title : 'Item #' + id;
        var parentTitle = item && item.ParentId0 && this._pendingMap[item.ParentId0]
          ? this._pendingMap[item.ParentId0].Title : 'Root';
        desc = 'Moved under "' + parentTitle + '"';
      } else {
        var item = this._pendingMap[id];
        title = item ? item.Title : 'Item #' + id;
        var fields = c.fields ? Object.keys(c.fields) : [];
        desc = 'Modified: ' + fields.join(', ');
      }
      list.push({ id: parseInt(id), type: c.type, title: title, description: desc });
    }
    return list;
  };

  // ── Get changes organized for save ──
  ChangeTracker.prototype.getChangesForSave = function() {
    var creates = [], updates = [], deletes = [];
    for (var id in this._changes) {
      if (!this._changes.hasOwnProperty(id)) continue;
      var c = this._changes[id];
      var numId = parseInt(id);
      if (c.type === 'create') {
        var item = this._pendingMap[id];
        if (item) creates.push({ tempId: numId, data: item });
      } else if (c.type === 'delete') {
        deletes.push(numId);
      } else {
        // update or move — send only changed fields
        var item = this._pendingMap[id];
        if (!item) continue;
        var data = {};
        for (var k in c.fields) {
          if (c.fields.hasOwnProperty(k)) data[k] = item[k];
        }
        updates.push({ id: numId, data: data });
      }
    }
    // Sort creates: parents before children (higher ParentId0 depth later)
    creates.sort(function(a, b) {
      var aDepth = a.data.ParentId0 && a.data.ParentId0 < 0 ? 1 : 0;
      var bDepth = b.data.ParentId0 && b.data.ParentId0 < 0 ? 1 : 0;
      return aDepth - bDepth;
    });
    return { creates: creates, updates: updates, deletes: deletes };
  };

  // ── Reset to baseline ──
  ChangeTracker.prototype.reset = function() {
    this._pendingItems = JSON.parse(JSON.stringify(this._baseline));
    this._pendingMap = {};
    for (var i = 0; i < this._pendingItems.length; i++) {
      this._pendingMap[this._pendingItems[i].Id] = this._pendingItems[i];
    }
    this._changes = {};
    this._undoStack = [];
    this._redoStack = [];
    this._fire();
  };

  // ── Revert a single item to baseline ──
  ChangeTracker.prototype.revertItem = function(id) {
    var change = this._changes[id];
    if (!change) return;
    var numId = typeof id === 'string' ? parseInt(id) : id;
    var KEYS = ['Title','NavUrl','ParentId0','SortOrder','Icon','IsNew','IsEnabled','OpenInNewWindow','Audience'];

    if (change.type === 'create') {
      var item = this._pendingMap[numId];
      if (!item) return;
      this._pushUndo({
        description: 'Revert create "' + item.Title + '"',
        operations: [{ type: 'delete', itemId: numId, before: JSON.parse(JSON.stringify(item)), after: null }]
      });
      this._pendingItems = this._pendingItems.filter(function(it) { return it.Id !== numId; });
      delete this._pendingMap[numId];
      delete this._changes[id];
    } else if (change.type === 'delete') {
      var bl = this._baselineMap[id];
      if (!bl) return;
      var restored = JSON.parse(JSON.stringify(bl));
      this._pushUndo({
        description: 'Revert delete "' + restored.Title + '"',
        operations: [{ type: 'create', itemId: numId, before: null, after: JSON.parse(JSON.stringify(restored)) }]
      });
      this._pendingItems.push(restored);
      this._pendingMap[numId] = restored;
      this._pendingMap[id] = restored;
      delete this._changes[id];
    } else {
      // update or move — restore baseline values
      var bl = this._baselineMap[id];
      var item = this._pendingMap[numId] || this._pendingMap[id];
      if (!bl || !item) return;
      var before = {}, after = {};
      for (var k = 0; k < KEYS.length; k++) {
        var key = KEYS[k];
        if (!this._valuesEqual(key, item[key], bl[key])) {
          before[key] = item[key];
          after[key] = bl[key];
          item[key] = bl[key];
        }
      }
      this._pushUndo({
        description: 'Revert "' + item.Title + '" to original',
        operations: [{ type: 'update', itemId: numId, before: before, after: after }]
      });
      delete this._changes[id];
    }
    this._fire();
  };

  // ── Baseline fingerprint for staleness comparison ──
  ChangeTracker.prototype.getBaselineFingerprint = function() {
    var parts = [];
    for (var i = 0; i < this._baseline.length; i++) {
      var it = this._baseline[i];
      parts.push(it.Id + ':' + (it.Title || '') + ':' + (it.SortOrder || 0));
    }
    parts.sort();
    return parts.join('|');
  };

  // ═══════════════════════════════════════════════════
  // Toast notifications
  // ═══════════════════════════════════════════════════
  function showToast(msg, type) {
    var container = document.getElementById('piadminToasts');
    var el = document.createElement('div');
    el.className = 'piadmin-toast ' + (type || 'info');
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(function() { el.remove(); }, 3500);
  }

  // ═══════════════════════════════════════════════════
  // HTML escaping
  // ═══════════════════════════════════════════════════
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function truncUrl(u) {
    if (!u || u === '#') return '';
    try { var p = new URL(u); return p.hostname + p.pathname.substring(0, 30) + (p.pathname.length > 30 ? '...' : ''); }
    catch(e) { return u.substring(0, 50); }
  }

  // ═══════════════════════════════════════════════════
  // TreeManager
  // ═══════════════════════════════════════════════════
  function TreeManager(containerEl, opts) {
    this._el = containerEl;
    this._items = [];
    this._tree = [];
    this._map = {};
    this._expanded = {};
    this._checked = {};
    this._selectedId = null;
    this._filter = '';
    this._matchIds = null; // set of ids matching filter
    this._statusFilter = '';
    this._depthFilter = '';
    this._sortCol = '';
    this._sortDir = 'asc';
    this._opts = opts || {};

    // Load expanded state from sessionStorage
    try {
      var saved = sessionStorage.getItem('piadmin_expanded');
      if (saved) this._expanded = JSON.parse(saved);
    } catch(e) {}
  }

  TreeManager.prototype.loadData = function(items) {
    this._items = items;
    this._map = {};
    for (var i = 0; i < items.length; i++) {
      this._map[items[i].Id] = items[i];
    }
    this._tree = this._buildTree(items);
    this.render();
  };

  TreeManager.prototype._buildTree = function(items) {
    var nodeMap = {}, roots = [], i, item, children = {};
    for (i = 0; i < items.length; i++) {
      item = items[i];
      nodeMap[item.Id] = item;
      item._children = [];
    }
    for (i = 0; i < items.length; i++) {
      item = items[i];
      var pid = item.ParentId0;
      if (pid && pid !== 0 && nodeMap[pid]) {
        nodeMap[pid]._children.push(item);
      } else {
        roots.push(item);
      }
    }
    return roots;
  };

  TreeManager.prototype.render = function() {
    var html = '';
    var hasActiveFilter = this._filter || this._statusFilter || this._depthFilter;
    if (this._tree.length === 0 && !hasActiveFilter) {
      html = '<div class="piadmin-tree-empty">No navigation items found.</div>';
    } else {
      for (var i = 0; i < this._tree.length; i++) {
        html += this._renderNode(this._tree[i], 0);
      }
      if (!html && hasActiveFilter) {
        html = '<div class="piadmin-tree-empty">No items match the current filters</div>';
      } else if (!html) {
        html = '<div class="piadmin-tree-empty">No navigation items found.</div>';
      }
    }
    this._el.innerHTML = html;
    this._bindEvents();
  };

  TreeManager.prototype._renderNode = function(item, depth) {
    var hasChildren = item._children && item._children.length > 0;
    var isExpanded = this._expanded[item.Id] !== false; // default expanded
    var isSelected = item.Id === this._selectedId;
    var isChecked = !!this._checked[item.Id];
    var isDisabled = item.IsEnabled === false;

    // Cap indentation at depth 3, show depth pill for deeper
    var visualDepth = Math.min(depth, 3);
    var padLeft = visualDepth * 20 + 12;
    var depthPill = depth > 3 ? '<span class="piadmin-depth-pill">L' + depth + '</span>' : '';

    // Filter: if matchIds is set, skip items not in the set and not ancestors of matches
    if (this._matchIds && !this._matchIds.has(item.Id) && !this._hasMatchDescendant(item)) {
      return '';
    }

    // Depth filter
    if (this._depthFilter) {
      var df = this._depthFilter;
      var passDepth = false;
      if (df === '0') passDepth = depth === 0;
      else if (df === '0-1') passDepth = depth <= 1;
      else if (df === '0-2') passDepth = depth <= 2;
      else if (df === '3+') passDepth = depth >= 3;
      else passDepth = true;
      if (!passDepth && !this._hasFilterDescendant(item, depth)) return '';
    }

    // Status filter
    if (this._statusFilter) {
      var sf = this._statusFilter;
      var passStatus = true;
      if (sf === 'enabled') passStatus = item.IsEnabled !== false;
      else if (sf === 'disabled') passStatus = item.IsEnabled === false;
      else if (sf === 'new') passStatus = !!item.IsNew;
      else if (sf === 'header') passStatus = item.NavUrl === '#';
      if (!passStatus && !this._hasStatusDescendant(item)) return '';
    }

    var rowClasses = 'piadmin-tree-row';
    if (isSelected) rowClasses += ' selected';
    if (isDisabled) rowClasses += ' disabled-item';
    // Dirty-state indicator
    var dirtyType = typeof changeTracker !== 'undefined' ? changeTracker.getChangeType(item.Id) : null;
    if (dirtyType === 'update') rowClasses += ' piadmin-tree-row--dirty-update';
    else if (dirtyType === 'create') rowClasses += ' piadmin-tree-row--dirty-create';
    else if (dirtyType === 'move') rowClasses += ' piadmin-tree-row--dirty-move';

    var chevronClass = 'piadmin-tree-expand';
    if (hasChildren) chevronClass += ' has-children';
    if (hasChildren && isExpanded) chevronClass += ' expanded';

    var badges = '';
    if (item.IsNew) badges += '<span class="piadmin-badge piadmin-badge-new">NEW</span>';
    if (isDisabled) badges += '<span class="piadmin-badge piadmin-badge-disabled">OFF</span>';
    if (item.Audience) badges += '<span class="piadmin-badge piadmin-badge-audience">' + esc(item.Audience) + '</span>';
    if (item.NavUrl === '#') badges += '<span class="piadmin-badge piadmin-badge-header">Header</span>';

    var titleHtml = this._filter ? this._highlight(item.Title, this._filter) : esc(item.Title);

    var html = '<div class="piadmin-tree-node" data-id="' + item.Id + '">' +
      '<div class="' + rowClasses + '" data-id="' + item.Id + '" data-depth="' + depth + '" ' +
        'draggable="true" title="' + esc(item.Title) + '">' +
        // Name column
        '<div class="piadmin-tree-col-name" style="padding-left:' + padLeft + 'px;">' +
          '<input type="checkbox" class="piadmin-tree-check" data-id="' + item.Id + '"' + (isChecked ? ' checked' : '') + ' tabindex="-1">' +
          '<button class="' + chevronClass + '" data-id="' + item.Id + '">&#9654;</button>' +
          depthPill +
          '<span class="piadmin-tree-icon">' + (item.Icon ? esc(item.Icon) : (hasChildren ? '&#128193;' : '&#128279;')) + '</span>' +
          '<span class="piadmin-tree-title">' + titleHtml + '</span>' +
        '</div>' +
        // URL column
        '<div class="piadmin-tree-col-url"><span class="piadmin-tree-url" title="' + esc(item.NavUrl) + '">' + esc(truncUrl(item.NavUrl)) + '</span></div>' +
        // Status column
        '<div class="piadmin-tree-col-status"><span class="piadmin-tree-badges">' + badges + '</span></div>' +
        // Actions column
        '<div class="piadmin-tree-col-actions">' +
          '<button class="piadmin-tree-action" data-action="add-child" data-id="' + item.Id + '" title="Add child">+</button>' +
          '<button class="piadmin-tree-action" data-action="edit" data-id="' + item.Id + '" title="Edit">&#9998;</button>' +
          '<button class="piadmin-tree-action danger" data-action="delete" data-id="' + item.Id + '" title="Delete">&times;</button>' +
        '</div>' +
      '</div>';

    if (hasChildren) {
      html += '<div class="piadmin-tree-children' + (isExpanded ? '' : ' collapsed') + '">';
      for (var c = 0; c < item._children.length; c++) {
        html += this._renderNode(item._children[c], depth + 1);
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  };

  TreeManager.prototype._hasMatchDescendant = function(item) {
    if (!item._children) return false;
    for (var i = 0; i < item._children.length; i++) {
      if (this._matchIds.has(item._children[i].Id)) return true;
      if (this._hasMatchDescendant(item._children[i])) return true;
    }
    return false;
  };

  // Depth filter: check if any descendant passes at the required depth
  TreeManager.prototype._hasFilterDescendant = function(item, currentDepth) {
    if (!item._children) return false;
    var df = this._depthFilter;
    for (var i = 0; i < item._children.length; i++) {
      var cd = currentDepth + 1;
      var pass = false;
      if (df === '0') pass = cd === 0;
      else if (df === '0-1') pass = cd <= 1;
      else if (df === '0-2') pass = cd <= 2;
      else if (df === '3+') pass = cd >= 3;
      if (pass) return true;
      if (this._hasFilterDescendant(item._children[i], cd)) return true;
    }
    return false;
  };

  // Status filter: check if any descendant passes the status filter
  TreeManager.prototype._hasStatusDescendant = function(item) {
    if (!item._children) return false;
    var sf = this._statusFilter;
    for (var i = 0; i < item._children.length; i++) {
      var c = item._children[i];
      var pass = true;
      if (sf === 'enabled') pass = c.IsEnabled !== false;
      else if (sf === 'disabled') pass = c.IsEnabled === false;
      else if (sf === 'new') pass = !!c.IsNew;
      else if (sf === 'header') pass = c.NavUrl === '#';
      if (pass) return true;
      if (this._hasStatusDescendant(c)) return true;
    }
    return false;
  };

  // Set status/depth filters
  TreeManager.prototype.setStatusFilter = function(val) {
    this._statusFilter = val;
    this.render();
    this._updateVisibleCount();
  };

  TreeManager.prototype.setDepthFilter = function(val) {
    this._depthFilter = val;
    this.render();
    this._updateVisibleCount();
  };

  // Count visible items and update counter
  TreeManager.prototype._updateVisibleCount = function() {
    var shown = this._el.querySelectorAll('.piadmin-tree-row').length;
    var total = this._items.length;
    var el = document.getElementById('piadminItemCount');
    if (el) {
      if (shown < total) el.textContent = shown + ' of ' + total + ' items';
      else el.textContent = total + ' items';
    }
  };

  // Sort
  TreeManager.prototype.sortBy = function(col, dir) {
    this._sortCol = col;
    this._sortDir = dir;
    // Re-sort children at each level
    this._sortTree(this._tree);
    this.render();
  };

  TreeManager.prototype._sortTree = function(nodes) {
    var col = this._sortCol;
    var dir = this._sortDir === 'desc' ? -1 : 1;
    if (!col) return;
    nodes.sort(function(a, b) {
      var va, vb;
      if (col === 'name') { va = (a.Title || '').toLowerCase(); vb = (b.Title || '').toLowerCase(); }
      else if (col === 'url') { va = (a.NavUrl || '').toLowerCase(); vb = (b.NavUrl || '').toLowerCase(); }
      else if (col === 'status') {
        va = (a.IsEnabled === false ? 'z' : 'a') + (a.IsNew ? 'a' : 'z');
        vb = (b.IsEnabled === false ? 'z' : 'a') + (b.IsNew ? 'a' : 'z');
      }
      else return 0;
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i]._children && nodes[i]._children.length) this._sortTree(nodes[i]._children);
    }
  };

  TreeManager.prototype._highlight = function(text, query) {
    var lower = text.toLowerCase();
    var qLower = query.toLowerCase();
    var idx = lower.indexOf(qLower);
    if (idx === -1) return esc(text);
    return esc(text.substring(0, idx)) + '<mark>' + esc(text.substring(idx, idx + query.length)) + '</mark>' + esc(text.substring(idx + query.length));
  };

  TreeManager.prototype.filterByText = function(query) {
    this._filter = query;
    if (!query) {
      this._matchIds = null;
      this.render();
      this._updateVisibleCount();
      return;
    }
    var q = query.toLowerCase();
    this._matchIds = new Set();
    for (var i = 0; i < this._items.length; i++) {
      if (this._items[i].Title.toLowerCase().indexOf(q) !== -1) {
        this._matchIds.add(this._items[i].Id);
        // Expand ancestors
        var pid = this._items[i].ParentId0;
        while (pid && pid !== 0 && this._map[pid]) {
          this._expanded[pid] = true;
          pid = this._map[pid].ParentId0;
        }
      }
    }
    this.render();
    this._updateVisibleCount();
  };

  TreeManager.prototype._bindEvents = function() {
    var self = this;
    this._el.addEventListener('click', function(e) {
      var target = e.target;

      // Expand/collapse
      if (target.closest('.piadmin-tree-expand')) {
        var btn = target.closest('.piadmin-tree-expand');
        var id = parseInt(btn.getAttribute('data-id'));
        self._toggleExpand(id);
        e.stopPropagation();
        return;
      }

      // Checkbox
      if (target.classList.contains('piadmin-tree-check')) {
        var cid = parseInt(target.getAttribute('data-id'));
        self._checked[cid] = target.checked;
        self._updateBulkButton();
        e.stopPropagation();
        return;
      }

      // Action buttons
      var actionBtn = target.closest('.piadmin-tree-action');
      if (actionBtn) {
        var action = actionBtn.getAttribute('data-action');
        var aid = parseInt(actionBtn.getAttribute('data-id'));
        if (action === 'edit' && self._opts.onEdit) self._opts.onEdit(self._map[aid]);
        if (action === 'delete' && self._opts.onDelete) self._opts.onDelete(self._map[aid]);
        if (action === 'add-child' && self._opts.onAddChild) self._opts.onAddChild(self._map[aid]);
        e.stopPropagation();
        return;
      }

      // Row click = select
      var row = target.closest('.piadmin-tree-row');
      if (row) {
        var rid = parseInt(row.getAttribute('data-id'));
        self._selectItem(rid);
      }
    });

    // Drag and drop
    this._initDragDrop();
  };

  TreeManager.prototype._toggleExpand = function(id) {
    this._expanded[id] = !this._expanded[id];
    try { sessionStorage.setItem('piadmin_expanded', JSON.stringify(this._expanded)); } catch(e) {}
    var node = this._el.querySelector('.piadmin-tree-node[data-id="' + id + '"]');
    if (!node) return;
    var chevron = node.querySelector(':scope > .piadmin-tree-row .piadmin-tree-expand');
    var children = node.querySelector(':scope > .piadmin-tree-children');
    if (chevron) chevron.classList.toggle('expanded', this._expanded[id]);
    if (children) children.classList.toggle('collapsed', !this._expanded[id]);
  };

  TreeManager.prototype.expandAll = function() {
    for (var id in this._map) { this._expanded[id] = true; }
    try { sessionStorage.setItem('piadmin_expanded', JSON.stringify(this._expanded)); } catch(e) {}
    this.render();
  };

  TreeManager.prototype.collapseAll = function() {
    for (var id in this._map) { this._expanded[id] = false; }
    try { sessionStorage.setItem('piadmin_expanded', JSON.stringify(this._expanded)); } catch(e) {}
    this.render();
  };

  TreeManager.prototype._selectItem = function(id) {
    // Deselect old
    var old = this._el.querySelector('.piadmin-tree-row.selected');
    if (old) old.classList.remove('selected');
    this._selectedId = id;
    var row = this._el.querySelector('.piadmin-tree-row[data-id="' + id + '"]');
    if (row) row.classList.add('selected');
    // Update breadcrumb
    this._updateBreadcrumb(id);
    if (this._opts.onSelect) this._opts.onSelect(this._map[id]);
  };

  TreeManager.prototype._updateBreadcrumb = function(id) {
    var bc = document.getElementById('piadminBreadcrumb');
    var path = this.getPath(id);
    if (path.length <= 1) { bc.classList.remove('visible'); return; }
    var html = '';
    for (var i = 0; i < path.length; i++) {
      if (i > 0) html += '<span class="piadmin-breadcrumb-sep">&#8250;</span>';
      if (i === path.length - 1) {
        html += '<span class="piadmin-breadcrumb-current">' + esc(path[i].Title) + '</span>';
      } else {
        html += '<span class="piadmin-breadcrumb-seg" data-id="' + path[i].Id + '">' + esc(path[i].Title) + '</span>';
      }
    }
    bc.innerHTML = html;
    bc.classList.add('visible');
  };

  TreeManager.prototype.getPath = function(id) {
    var path = [];
    var item = this._map[id];
    while (item) {
      path.unshift(item);
      item = (item.ParentId0 && item.ParentId0 !== 0) ? this._map[item.ParentId0] : null;
    }
    return path;
  };

  TreeManager.prototype.getCheckedIds = function() {
    var ids = [];
    for (var id in this._checked) {
      if (this._checked[id]) ids.push(parseInt(id));
    }
    return ids;
  };

  TreeManager.prototype.clearChecks = function() {
    this._checked = {};
    var boxes = this._el.querySelectorAll('.piadmin-tree-check:checked');
    for (var i = 0; i < boxes.length; i++) boxes[i].checked = false;
    this._updateBulkButton();
  };

  TreeManager.prototype._updateBulkButton = function() {
    var btn = document.getElementById('piadminBulkApply');
    btn.disabled = this.getCheckedIds().length === 0;
  };

  TreeManager.prototype.getDescendantIds = function(id) {
    var ids = [];
    var item = this._map[id];
    if (!item || !item._children) return ids;
    for (var i = 0; i < item._children.length; i++) {
      ids.push(item._children[i].Id);
      ids = ids.concat(this.getDescendantIds(item._children[i].Id));
    }
    return ids;
  };

  // ── Drag & Drop ──
  TreeManager.prototype._initDragDrop = function() {
    var self = this;
    var dragId = null;
    var dragDescendants = new Set();

    this._el.addEventListener('dragstart', function(e) {
      var row = e.target.closest('.piadmin-tree-row');
      if (!row) return;
      dragId = parseInt(row.getAttribute('data-id'));
      dragDescendants = new Set(self.getDescendantIds(dragId));
      dragDescendants.add(dragId);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(dragId));
    });

    this._el.addEventListener('dragover', function(e) {
      var row = e.target.closest('.piadmin-tree-row');
      if (!row) return;
      var targetId = parseInt(row.getAttribute('data-id'));
      if (dragDescendants.has(targetId)) return; // can't drop on self/descendants
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      // Clear old indicators
      var allRows = self._el.querySelectorAll('.piadmin-tree-row');
      for (var i = 0; i < allRows.length; i++) {
        allRows[i].classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-child');
      }

      // Determine drop position
      var rect = row.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var pct = y / rect.height;
      if (pct < 0.25) row.classList.add('drag-over-top');
      else if (pct > 0.75) row.classList.add('drag-over-bottom');
      else row.classList.add('drag-over-child');
    });

    this._el.addEventListener('dragleave', function(e) {
      var row = e.target.closest('.piadmin-tree-row');
      if (row) row.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-child');
    });

    this._el.addEventListener('drop', function(e) {
      e.preventDefault();
      var row = e.target.closest('.piadmin-tree-row');
      if (!row || !dragId) return;
      var targetId = parseInt(row.getAttribute('data-id'));
      if (dragDescendants.has(targetId)) return;

      var rect = row.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var pct = y / rect.height;
      var position = pct < 0.25 ? 'before' : (pct > 0.75 ? 'after' : 'child');

      if (self._opts.onDrop) self._opts.onDrop(dragId, targetId, position);

      // Cleanup
      var allRows = self._el.querySelectorAll('.piadmin-tree-row');
      for (var i = 0; i < allRows.length; i++) {
        allRows[i].classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-child', 'dragging');
      }
      dragId = null;
      dragDescendants = new Set();
    });

    this._el.addEventListener('dragend', function() {
      var allRows = self._el.querySelectorAll('.piadmin-tree-row');
      for (var i = 0; i < allRows.length; i++) {
        allRows[i].classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-child', 'dragging');
      }
      dragId = null;
      dragDescendants = new Set();
    });
  };

  // ═══════════════════════════════════════════════════
  // ItemEditor — Edit Panel
  // ═══════════════════════════════════════════════════
  function ItemEditor(opts) {
    this._mode = 'create';
    this._item = null;
    this._allItems = [];
    this._parentId = null;
    this._opts = opts;
  }

  ItemEditor.prototype.open = function(mode, item, allItems, parentId) {
    this._mode = mode;
    this._item = item;
    this._allItems = allItems;
    this._parentId = parentId || null;

    document.getElementById('piadminPanelTitle').textContent = mode === 'create' ? 'Add Item' : 'Edit Item';

    var body = document.getElementById('piadminPanelBody');
    var parentOptions = '<option value="0">Root (no parent)</option>';
    var editId = item ? item.Id : null;
    var flatItems = this._flattenTree(allItems, '', editId);
    for (var i = 0; i < flatItems.length; i++) {
      var fi = flatItems[i];
      var sel = '';
      if (mode === 'create' && this._parentId && fi.id === this._parentId) sel = ' selected';
      else if (mode === 'edit' && item && item.ParentId0 === fi.id) sel = ' selected';
      parentOptions += '<option value="' + fi.id + '"' + sel + '>' + esc(fi.label) + '</option>';
    }

    var val = item || { Title:'', NavUrl:'', Icon:'', SortOrder:0, IsNew:false, IsEnabled:true, OpenInNewWindow:true, Audience:'' };

    // Check if this item has pending changes (for baseline hints)
    var bl = null, isDirtyItem = false;
    if (mode === 'edit' && item && changeTracker._changes[item.Id]) {
      bl = changeTracker._baselineMap[item.Id] || null;
      isDirtyItem = !!bl;
    }

    // Helper: baseline hint for a text/number field
    function baselineHint(field, blVal) {
      if (!isDirtyItem || !bl) return '';
      var curVal = val[field];
      var changed = false;
      if (typeof blVal === 'boolean' || typeof curVal === 'boolean') {
        changed = (!!blVal) !== (!!curVal);
      } else if (field === 'ParentId0' || field === 'SortOrder') {
        changed = (blVal || 0) !== (curVal || 0);
      } else {
        changed = (blVal || '') !== (curVal || '');
      }
      if (!changed) return '';
      var display = DiffEngine.formatValue(field, blVal, changeTracker._baselineMap);
      return '<div class="piadmin-field-baseline">' + esc(display) + '</div>';
    }
    function dirtyClass(field) {
      if (!isDirtyItem || !bl) return 'piadmin-field';
      var curVal = val[field], blVal = bl[field];
      var changed = false;
      if (typeof blVal === 'boolean' || typeof curVal === 'boolean') {
        changed = (!!blVal) !== (!!curVal);
      } else if (field === 'ParentId0' || field === 'SortOrder') {
        changed = (blVal || 0) !== (curVal || 0);
      } else {
        changed = (blVal || '') !== (curVal || '');
      }
      return changed ? 'piadmin-field piadmin-field--dirty' : 'piadmin-field';
    }

    body.innerHTML =
      '<div class="' + dirtyClass('Title') + '"><label>Title *</label>' +
        '<input type="text" id="piadminFieldTitle" value="' + esc(val.Title) + '" placeholder="Menu item title">' +
        baselineHint('Title', bl ? bl.Title : null) + '</div>' +
      '<div class="' + dirtyClass('NavUrl') + '"><label>URL</label>' +
        '<input type="url" id="piadminFieldUrl" value="' + esc(val.NavUrl === '#' ? '' : val.NavUrl) + '" placeholder="https://... or # for header">' +
        '<div class="piadmin-field-hint">Use # for parent/header items with no link</div>' +
        baselineHint('NavUrl', bl ? bl.NavUrl : null) + '</div>' +
      '<div class="' + dirtyClass('ParentId0') + '"><label>Parent</label>' +
        '<select id="piadminFieldParent">' + parentOptions + '</select>' +
        baselineHint('ParentId0', bl ? bl.ParentId0 : null) + '</div>' +
      '<div class="' + dirtyClass('Icon') + '"><label>Icon</label>' +
        '<input type="text" id="piadminFieldIcon" value="' + esc(val.Icon) + '" placeholder="Emoji or text">' +
        '<div class="piadmin-field-hint">e.g. &#128640; &#9733; &#128200;</div>' +
        baselineHint('Icon', bl ? bl.Icon : null) + '</div>' +
      '<div class="' + dirtyClass('SortOrder') + '"><label>Sort Order</label>' +
        '<input type="number" id="piadminFieldSort" value="' + (val.SortOrder || 0) + '">' +
        baselineHint('SortOrder', bl ? bl.SortOrder : null) + '</div>' +
      '<div class="' + dirtyClass('Audience') + '"><label>Audience</label>' +
        '<input type="text" id="piadminFieldAudience" value="' + esc(val.Audience) + '" placeholder="Group names (comma separated)">' +
        baselineHint('Audience', bl ? bl.Audience : null) + '</div>' +
      '<div class="piadmin-field">' +
        '<label class="piadmin-toggle"><input type="checkbox" id="piadminFieldNew"' + (val.IsNew ? ' checked' : '') + '>' +
        '<span class="piadmin-toggle-track"><span class="piadmin-toggle-thumb"></span></span>' +
        '<span class="piadmin-toggle-label">Show NEW badge</span></label>' +
        baselineHint('IsNew', bl ? bl.IsNew : null) + '</div>' +
      '<div class="piadmin-field">' +
        '<label class="piadmin-toggle"><input type="checkbox" id="piadminFieldEnabled"' + (val.IsEnabled !== false ? ' checked' : '') + '>' +
        '<span class="piadmin-toggle-track"><span class="piadmin-toggle-thumb"></span></span>' +
        '<span class="piadmin-toggle-label">Enabled</span></label>' +
        baselineHint('IsEnabled', bl ? bl.IsEnabled : null) + '</div>' +
      '<div class="piadmin-field">' +
        '<label class="piadmin-toggle"><input type="checkbox" id="piadminFieldNewWindow"' + (val.OpenInNewWindow !== false ? ' checked' : '') + '>' +
        '<span class="piadmin-toggle-track"><span class="piadmin-toggle-thumb"></span></span>' +
        '<span class="piadmin-toggle-label">Open in new window</span></label>' +
        baselineHint('OpenInNewWindow', bl ? bl.OpenInNewWindow : null) + '</div>' +
      (isDirtyItem ? '<button class="piadmin-panel-revert" id="piadminPanelRevert" data-revert-id="' + item.Id + '">Revert to Original</button>' : '');

    document.getElementById('piadminPanel').classList.add('open');
    document.getElementById('piadminPanelOverlay').classList.add('visible');
    setTimeout(function() { document.getElementById('piadminFieldTitle').focus(); }, 300);

    // Wire revert button inside panel
    var panelRevertBtn = document.getElementById('piadminPanelRevert');
    if (panelRevertBtn) {
      panelRevertBtn.addEventListener('click', function() {
        var rid = this.getAttribute('data-revert-id');
        changeTracker.revertItem(rid);
        editor.close();
        refreshTreeFromPending();
        showToast('Reverted "' + (bl ? bl.Title : 'item') + '" to original', 'info');
      });
    }
  };

  ItemEditor.prototype._flattenTree = function(items, prefix, excludeId) {
    // Build tree from flat items, then flatten with indent
    var map = {}, roots = [], result = [];
    for (var i = 0; i < items.length; i++) {
      map[items[i].Id] = { item: items[i], children: [] };
    }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var pid = it.ParentId0;
      if (pid && pid !== 0 && map[pid]) {
        map[pid].children.push(map[it.Id]);
      } else {
        roots.push(map[it.Id]);
      }
    }
    var walk = function(nodes, depth) {
      for (var n = 0; n < nodes.length; n++) {
        var node = nodes[n];
        if (excludeId && node.item.Id === excludeId) continue;
        var indent = '';
        for (var d = 0; d < depth; d++) indent += '\u00A0\u00A0\u00A0\u00A0';
        result.push({ id: node.item.Id, label: indent + node.item.Title });
        if (node.children.length) walk(node.children, depth + 1);
      }
    };
    walk(roots, 0);
    return result;
  };

  ItemEditor.prototype.close = function() {
    document.getElementById('piadminPanel').classList.remove('open');
    document.getElementById('piadminPanelOverlay').classList.remove('visible');
  };

  ItemEditor.prototype.getValues = function() {
    var title = document.getElementById('piadminFieldTitle').value.trim();
    if (!title) return null;
    var url = document.getElementById('piadminFieldUrl').value.trim() || '#';
    var parentId = parseInt(document.getElementById('piadminFieldParent').value) || 0;
    return {
      Title: title,
      NavUrl: url,
      ParentId0: parentId,
      SortOrder: parseInt(document.getElementById('piadminFieldSort').value) || 0,
      Icon: document.getElementById('piadminFieldIcon').value.trim(),
      IsNew: document.getElementById('piadminFieldNew').checked,
      IsEnabled: document.getElementById('piadminFieldEnabled').checked,
      OpenInNewWindow: document.getElementById('piadminFieldNewWindow').checked,
      Audience: document.getElementById('piadminFieldAudience').value.trim()
    };
  };

  // ═══════════════════════════════════════════════════
  // Preview Renderer
  // ═══════════════════════════════════════════════════
  function renderPreview(tree, containerEl) {
    var html = '';
    var walk = function(nodes, depth) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var cls = 'piadmin-preview-item depth-' + depth;
        if (n.IsEnabled === false) cls += ' piadmin-preview-disabled';
        var pad = depth * 16;
        var hasUrl = n.NavUrl && n.NavUrl !== '#' && n.NavUrl !== '';
        var tag = hasUrl ? 'a' : 'div';
        html += '<' + tag + ' class="' + cls + '" style="padding-left:' + (8 + pad) + 'px;"';
        if (hasUrl) html += ' href="' + esc(n.NavUrl) + '" target="_blank" rel="noopener"';
        html += '>';
        if (n.Icon) html += '<span>' + esc(n.Icon) + '</span>';
        html += '<span>' + esc(n.Title) + '</span>';
        if (n.IsNew) html += '<span class="new-dot"></span>';
        html += '</' + tag + '>';
        if (n._children && n._children.length && n.IsEnabled !== false) {
          walk(n._children, depth + 1);
        }
      }
    };
    walk(tree, 0);
    containerEl.innerHTML = html || '<div style="color:var(--text-tertiary);padding:20px;text-align:center;">No items</div>';
  }

  // ═══════════════════════════════════════════════════
  // AdminApp — Orchestrator
  // ═══════════════════════════════════════════════════
  var api = new ApiService(siteUrl);
  var changeTracker = new ChangeTracker();
  var treeEl = document.getElementById('piadminTreeBody');
  var treeContainer = document.getElementById('piadminTree');
  var tree, editor;

  // Theme detection & toggle (light / dark / high-contrast)
  var root = document.getElementById('piadminRoot');
  var themeBtn = document.getElementById('piadminThemeToggle');
  var themes = ['light', 'dark', 'hc'];
  var themeIcons = { light: '\u2600', dark: '\u263D', hc: '\u25D1' }; // ☀ ☽ ◑

  function applyTheme(name) {
    root.classList.remove('piadmin-dark', 'piadmin-hc');
    if (name === 'dark') root.classList.add('piadmin-dark');
    else if (name === 'hc') root.classList.add('piadmin-hc');
    themeBtn.textContent = themeIcons[name] || themeIcons.light;
    themeBtn.title = 'Theme: ' + name.charAt(0).toUpperCase() + name.slice(1) + ' (click to switch)';
  }

  function detectTheme() {
    var theme = 'light';
    if (window.__themeState__ && window.__themeState__.theme) {
      var bg = window.__themeState__.theme.bodyBackground || '';
      if (bg) {
        var c = bg.replace('#','');
        if (c.length === 6) {
          var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
          if (r*0.299 + g*0.587 + b*0.114 < 128) theme = 'dark';
        }
      }
    }
    if (theme === 'light' && window.matchMedia) {
      if (window.matchMedia('(prefers-contrast: more)').matches || window.matchMedia('(forced-colors: active)').matches) theme = 'hc';
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
    }
    try { var saved = localStorage.getItem('piadmin_theme'); if (saved && themes.indexOf(saved) > -1) theme = saved; } catch(e) {}
    applyTheme(theme);
  }
  detectTheme();

  themeBtn.addEventListener('click', function() {
    var current = root.classList.contains('piadmin-hc') ? 'hc' : root.classList.contains('piadmin-dark') ? 'dark' : 'light';
    var next = themes[(themes.indexOf(current) + 1) % themes.length];
    applyTheme(next);
    try { localStorage.setItem('piadmin_theme', next); } catch(e) {}
  });

  // Section tabs
  var tabs = root.querySelectorAll('.piadmin-tab');
  var sections = root.querySelectorAll('.piadmin-section');
  for (var t = 0; t < tabs.length; t++) {
    tabs[t].addEventListener('click', function() {
      var sec = this.getAttribute('data-section');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle('active', tabs[i] === this);
        tabs[i].setAttribute('aria-selected', tabs[i] === this ? 'true' : 'false');
      }
      for (var i = 0; i < sections.length; i++) {
        sections[i].classList.toggle('active', sections[i].getAttribute('data-section-content') === sec);
      }
    });
  }

  // Initialize tree
  tree = new TreeManager(treeEl, {
    onEdit: function(item) { editor.open('edit', item, changeTracker.getPendingItems()); },
    onDelete: function(item) { confirmDelete(item); },
    onAddChild: function(parent) { editor.open('create', null, changeTracker.getPendingItems(), parent.Id); },
    onSelect: function(item) { /* breadcrumb updates automatically */ },
    onDrop: function(dragId, targetId, position) { handleDrop(dragId, targetId, position); }
  });

  editor = new ItemEditor({});

  // Load data
  function loadData() {
    var loadingEl = document.getElementById('piadminLoading');
    if (loadingEl) loadingEl.style.display = '';
    else treeEl.innerHTML = '<div class="piadmin-loading" id="piadminLoading"><div class="piadmin-spinner"></div><span>Loading...</span></div>';
    api.getItems().then(function(items) {
      var le = document.getElementById('piadminLoading');
      if (le) le.style.display = 'none';
      changeTracker.init(items);
      tree.loadData(items);
      document.getElementById('piadminNavCount').textContent = items.length;
      document.getElementById('piadminItemCount').textContent = items.length + ' items';
      renderPreview(tree._tree, document.querySelector('.piadmin-preview-nav'));
      updateDirtyUI();

      // Check for session recovery data
      var recovery = getSessionRecovery();
      if (recovery && recovery.items && recovery.items.length > 0) {
        // Simple check: if recovery data differs from freshly loaded items
        var serverIds = items.map(function(it) { return it.Id; }).sort().join(',');
        var recoveryIds = recovery.items.map(function(it) { return it.Id; }).sort().join(',');
        if (serverIds !== recoveryIds || recovery.items.length !== items.length) {
          // Show recovery dialog
          var dialog = document.getElementById('piadminDialog');
          var ago = Math.round((Date.now() - recovery.timestamp) / 60000);
          dialog.innerHTML = '<h3>Recover Unsaved Changes?</h3>' +
            '<p>Found unsaved changes from <strong>' + ago + ' minute' + (ago !== 1 ? 's' : '') + ' ago</strong> ' +
            '(' + recovery.items.length + ' items). Restore them?</p>' +
            '<div class="piadmin-dialog-actions">' +
            '<button class="piadmin-btn" id="piadminRecoveryDiscard">Discard</button>' +
            '<button class="piadmin-btn-primary" id="piadminRecoveryRestore">Restore</button></div>';
          document.getElementById('piadminDialogBackdrop').classList.add('visible');
          document.getElementById('piadminRecoveryDiscard').onclick = function() {
            document.getElementById('piadminDialogBackdrop').classList.remove('visible');
            clearSessionRecovery();
          };
          document.getElementById('piadminRecoveryRestore').onclick = function() {
            document.getElementById('piadminDialogBackdrop').classList.remove('visible');
            // Apply recovered items as pending by comparing vs baseline
            var recMap = {};
            for (var r = 0; r < recovery.items.length; r++) recMap[recovery.items[r].Id] = recovery.items[r];
            var KEYS = DiffEngine.TRACKED_FIELDS;
            // Detect updates
            for (var r = 0; r < recovery.items.length; r++) {
              var ri = recovery.items[r];
              var bi = changeTracker._baselineMap[ri.Id];
              if (!bi) continue; // skip creates from recovery (complex)
              var diff = {};
              var hasDiff = false;
              for (var k = 0; k < KEYS.length; k++) {
                var key = KEYS[k];
                if (!changeTracker._valuesEqual(key, ri[key], bi[key])) {
                  diff[key] = ri[key]; hasDiff = true;
                }
              }
              if (hasDiff) changeTracker.recordUpdate(ri.Id, diff);
            }
            refreshTreeFromPending();
            clearSessionRecovery();
            showToast('Restored ' + recovery.items.length + ' items from session backup', 'info');
          };
        } else {
          clearSessionRecovery();
        }
      }
    }).catch(function(err) {
      var le = document.getElementById('piadminLoading');
      if (le) le.style.display = 'none';
      showToast('Failed to load: ' + err.message, 'error');
    });
  }

  // Refresh tree from pending changes (no API call)
  function refreshTreeFromPending() {
    tree.loadData(changeTracker.getPendingItems());
    renderPreview(tree._tree, document.querySelector('.piadmin-preview-nav'));
    updateDirtyUI();
  }

  // Update all dirty-state UI elements
  function updateDirtyUI() {
    var dirty = changeTracker.isDirty();
    var count = changeTracker.getChangeCount();
    var display = dirty ? '' : 'none';

    // Toolbar buttons
    document.getElementById('piadminSaveAll').style.display = display;
    document.getElementById('piadminDiscardAll').style.display = display;
    document.getElementById('piadminUndoBtn').style.display = changeTracker.canUndo() || dirty ? '' : 'none';
    document.getElementById('piadminRedoBtn').style.display = changeTracker.canRedo() || dirty ? '' : 'none';
    document.getElementById('piadminEditModeSep').style.display = display;
    document.getElementById('piadminSaveAll').disabled = !dirty;
    document.getElementById('piadminUndoBtn').disabled = !changeTracker.canUndo();
    document.getElementById('piadminRedoBtn').disabled = !changeTracker.canRedo();

    // Dirty badge
    var badge = document.getElementById('piadminDirtyBadge');
    badge.style.display = dirty ? 'inline-flex' : 'none';
    document.getElementById('piadminDirtyCount').textContent = count;

    // Nav tab badge
    var navCount = document.getElementById('piadminNavCount');
    navCount.textContent = changeTracker.getPendingItems().length + (dirty ? '*' : '');

    // Item count
    var itemCountEl = document.getElementById('piadminItemCount');
    itemCountEl.textContent = changeTracker.getPendingItems().length + ' items' + (dirty ? ' (' + count + ' unsaved)' : '');

    // Changes summary panel
    var changesSection = document.getElementById('piadminChangesSection');
    var changesList = document.getElementById('piadminChangesList');
    var changesCount = document.getElementById('piadminChangesCount');
    if (dirty) {
      changesSection.style.display = '';
      changesCount.textContent = count;
      var changes = changeTracker.getChangeList();
      var blMap = changeTracker._baselineMap;
      var pMap = changeTracker.getPendingMap();
      var html = '';
      for (var i = 0; i < changes.length; i++) {
        var c = changes[i];
        var iconClass = 'piadmin-change-icon piadmin-change-icon--' + c.type;
        var icon = c.type === 'create' ? '+' : c.type === 'delete' ? '&times;' : c.type === 'move' ? '&#8618;' : '&#9998;';
        // Compute field-level diffs for update/move
        var diffHtml = '';
        if ((c.type === 'update' || c.type === 'move') && blMap[c.id] && pMap[c.id]) {
          var diffs = DiffEngine.diffItem(blMap[c.id], pMap[c.id], blMap, pMap);
          if (diffs.length) diffHtml = DiffEngine.renderFieldDiff(diffs);
        } else if (c.type === 'delete' && blMap[c.id]) {
          diffHtml = '<div class="piadmin-diff-row"><span class="piadmin-diff-label" style="color:var(--danger);">Will be permanently deleted on save</span></div>';
        }
        html += '<div class="piadmin-change-entry" data-change-id="' + c.id + '">' +
          '<span class="' + iconClass + '">' + icon + '</span>' +
          '<span class="piadmin-change-desc" title="' + esc(c.description) + '">' +
            '<strong>' + esc(c.title) + '</strong> <small>' + esc(c.description) + '</small></span>' +
          '<button class="piadmin-revert-btn" data-revert-id="' + c.id + '" title="Revert to original">Revert</button>' +
          (diffHtml ? '<button class="piadmin-change-expand" data-expand-id="' + c.id + '" aria-expanded="false" title="Show details">&#9654;</button>' : '') +
          '</div>';
        if (diffHtml) {
          html += '<div class="piadmin-diff-section" id="piadminDiff_' + c.id + '" style="display:none;">' + diffHtml + '</div>';
        }
      }
      changesList.innerHTML = html;
    } else {
      changesSection.style.display = 'none';
    }
  }

  // Changes panel click handler: revert, expand, or scroll to item
  document.getElementById('piadminChangesList').addEventListener('click', function(e) {
    // Revert button
    var revertBtn = e.target.closest('.piadmin-revert-btn');
    if (revertBtn) {
      e.stopPropagation();
      var rid = revertBtn.getAttribute('data-revert-id');
      var title = '';
      var pm = changeTracker.getPendingMap();
      var bm = changeTracker._baselineMap;
      if (pm[rid]) title = pm[rid].Title;
      else if (bm[rid]) title = bm[rid].Title;

  // Column resizer
  (function() {
    function setupResizer(handleId, cssVar, storageKey) {
      var handle = document.getElementById(handleId);
      if (!handle) return;
      var dragging = false;
      var startX, startW;

      // Restore saved width
      try {
        var saved = localStorage.getItem(storageKey);
        if (saved) treeContainer.style.setProperty(cssVar, saved + 'px');
      } catch(e) {}

      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        dragging = true;
        startX = e.clientX;
        // Get the column AFTER the handle (the one whose width we control)
        var col = handle.nextElementSibling;
        startW = col.offsetWidth;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        var diff = e.clientX - startX;
        // Dragging right = column gets narrower, dragging left = wider
        var newW = Math.max(80, startW - diff);
        treeContainer.style.setProperty(cssVar, newW + 'px');
        try { localStorage.setItem(storageKey, newW); } catch(e2) {}
      });

      document.addEventListener('mouseup', function() {
        if (dragging) {
          dragging = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    }

    setupResizer('piadminColResize1', '--col-url', 'piadmin_col_url');
    setupResizer('piadminColResize2', '--col-status', 'piadmin_col_status');

        // Normalize for comparison: treat null/undefined/0/"" as equivalent for non-boolean fields

          diff[k] = nv; hasDiff = true;

          diff[k] = nv; hasDiff = true;
        } else if (typeof nv === 'number' && typeof ov === 'number' && nv !== ov) {
          diff[k] = nv; hasDiff = true;
        }
      }
      if (hasDiff) {
        changeTracker.recordUpdate(editor._item.Id, diff);
        showToast('Item updated: ' + vals.Title + ' (unsaved)', 'info');

  // ═══════════════════════════════════════════════════
  // Save All Changes → batch API calls
  // ═══════════════════════════════════════════════════
  // ── Execute the actual save (called after review dialog confirmation) ──
  function executeSave() {
    var changes = changeTracker.getChangesForSave();
    var total = changes.creates.length + changes.updates.length + changes.deletes.length;
    var done = 0;

    // Show progress dialog
    var dialog = document.getElementById('piadminDialog');
    dialog.innerHTML = '<h3>Saving Changes</h3>' +
      '<p>Applying change <span id="piadminSaveProgress">0</span> of <strong>' + total + '</strong>...</p>' +
      '<div class="piadmin-save-progress"><div class="piadmin-save-progress-bar" id="piadminSaveBar" style="width:0%"></div></div>';
    document.getElementById('piadminDialogBackdrop').classList.add('visible');

    function updateProgress() {
      done++;
      var el = document.getElementById('piadminSaveProgress');
      if (el) el.textContent = done;
      var bar = document.getElementById('piadminSaveBar');
      if (bar) bar.style.width = Math.round(done / total * 100) + '%';
    }

    // Snapshot baseline to Site Assets before saving
    var snapshotPromise;
    try {
      var snapshotJson = JSON.stringify(changeTracker._baseline, null, 2);
      snapshotPromise = api.uploadSnapshot(snapshotJson).catch(function(err) {
        console.warn('Pre-save snapshot failed:', err);
        showToast('Snapshot backup failed (save will continue)', 'error');
      });
    } catch(e) {
      snapshotPromise = Promise.resolve();
    }

    snapshotPromise.then(function() {
      var tempIdMap = {};
      var chain = Promise.resolve();

      // Phase 1: Creates
      changes.creates.forEach(function(c) {
        chain = chain.then(function() {
          var data = Object.assign({}, c.data);
          delete data.Id;
          delete data._children;
          if (data.ParentId0 && data.ParentId0 < 0 && tempIdMap[data.ParentId0]) {
            data.ParentId0 = tempIdMap[data.ParentId0];
          }
          return api.createItem(data).then(function(created) {
            tempIdMap[c.tempId] = created.Id;
            updateProgress();
          });
        });
      });

      // Phase 2: Updates
      changes.updates.forEach(function(u) {
        chain = chain.then(function() {
          var data = Object.assign({}, u.data);
          if (data.ParentId0 && data.ParentId0 < 0 && tempIdMap[data.ParentId0]) {
            data.ParentId0 = tempIdMap[data.ParentId0];
          }
          return api.updateItem(u.id, data).then(function() { updateProgress(); });
        });
      });

      // Phase 3: Deletes
      changes.deletes.forEach(function(id) {
        chain = chain.then(function() {
          return api.deleteItem(id).then(function() { updateProgress(); });
        });
      });

      chain.then(function() {
        document.getElementById('piadminDialogBackdrop').classList.remove('visible');
        showToast('Saved ' + total + ' change' + (total > 1 ? 's' : ''), 'success');
        clearSessionRecovery();
        loadData();
      }).catch(function(err) {
        document.getElementById('piadminDialogBackdrop').classList.remove('visible');
        showToast('Save failed at step ' + done + ': ' + err.message + '. Reloading...', 'error');
        loadData();
      });
    });
  }

  // ── Save button → show Review Changes dialog first ──

    var deleteThreshold = Math.min(10, Math.floor(totalItems * 0.5));

    var blMap = changeTracker._baselineMap;

    // Build review items HTML
    var reviewHtml = '';
    for (var i = 0; i < changes.length; i++) {
      var c = changes[i];
      var item = pMap[c.id] || blMap[c.id] || { Id: c.id, Title: c.title };
      var diffs = [];
      if ((c.type === 'update' || c.type === 'move') && blMap[c.id] && pMap[c.id]) {
        diffs = DiffEngine.diffItem(blMap[c.id], pMap[c.id], blMap, pMap);

      reviewHtml += DiffEngine.renderReviewItem(item, c.type, diffs);
    }

    var dialog = document.getElementById('piadminDialog');
    var html = '<div class="piadmin-review-dialog">' +
      '<h3>Review Changes</h3>' +
