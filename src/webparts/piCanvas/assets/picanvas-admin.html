<style>
/* ══════════════════════════════════════════════════════
   PiCanvas Admin — Navigation & Content Management
   Standalone HTML asset for SharePoint
   ══════════════════════════════════════════════════════ */

/* ── Theme: Light (default) ── */
.piadmin-root {
  --accent: #0078d4;
  --accent-hover: #106ebe;
  --accent-light: #e8f4fd;
  --accent-text: #fff;
  --bg: #f5f5f5;
  --surface: #ffffff;
  --surface-hover: #f0f0f0;
  --surface-alt: #fafafa;
  --border: #e1e1e1;
  --border-light: #f0f0f0;
  --text: #1a1a1a;
  --text-secondary: #616161;
  --text-tertiary: #999;
  --danger: #d13438;
  --danger-bg: #fde7e9;
  --success: #107c10;
  --success-bg: #dff6dd;
  --warning: #ffaa44;
  --warning-bg: #fff4ce;
  --dirty-update-bg: rgba(255,170,68,.08);
  --dirty-update-border: #ffaa44;
  --dirty-create-bg: rgba(16,124,16,.08);
  --dirty-create-border: #107c10;
  --dirty-move-bg: rgba(0,120,212,.08);
  --dirty-move-border: #0078d4;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
  --radius: 6px;
  --radius-lg: 10px;
  --transition: .2s ease;
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'SF Mono', Monaco, Consolas, monospace;
  --header-h: 52px;
  --tabs-h: 40px;
  --toolbar-h: 48px;
  --indent: 24px;
}

/* ── Theme: Dark ── */
.piadmin-root.piadmin-dark {
  --accent: #4ea8fe;
  --accent-hover: #73baff;
  --accent-light: rgba(78,168,254,.15);
  --accent-text: #000;
  --bg: #1b1b1b;
  --surface: #252525;
  --surface-hover: #2d2d2d;
  --surface-alt: #202020;
  --border: #404040;
  --border-light: #333;
  --text: #e0e0e0;
  --text-secondary: #a0a0a0;
  --text-tertiary: #707070;
  --danger: #f5a0a0;
  --danger-bg: rgba(209,52,56,.2);
  --success: #7ece7e;
  --success-bg: rgba(16,124,16,.2);
  --dirty-update-bg: rgba(255,170,68,.15);
  --dirty-update-border: #ffaa44;
  --dirty-create-bg: rgba(63,242,63,.12);
  --dirty-create-border: #3ff23f;
  --dirty-move-bg: rgba(78,168,254,.12);
  --dirty-move-border: #4fc3f7;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
}

/* ── Theme: High Contrast ── */
.piadmin-root.piadmin-hc {
  --accent: #1aebff;
  --accent-hover: #23f0ff;
  --accent-light: rgba(26,235,255,.2);
  --accent-text: #000;
  --bg: #000000;
  --surface: #000000;
  --surface-hover: #1a1a1a;
  --surface-alt: #000000;
  --border: #6fc3df;
  --border-light: #3b8da6;
  --text: #ffffff;
  --text-secondary: #ffff00;
  --text-tertiary: #1aebff;
  --danger: #ff6060;
  --danger-bg: rgba(255,96,96,.25);
  --success: #3ff23f;
  --success-bg: rgba(63,242,63,.2);
  --warning: #ffff00;
  --warning-bg: rgba(255,255,0,.2);
  --dirty-update-bg: rgba(255,255,0,.15);
  --dirty-update-border: #ffff00;
  --dirty-create-bg: rgba(63,242,63,.15);
  --dirty-create-border: #3ff23f;
  --dirty-move-bg: rgba(26,235,255,.15);
  --dirty-move-border: #1aebff;
  --shadow: 0 0 0 1px var(--border);
  --shadow-lg: 0 0 0 2px var(--border);
}
.piadmin-root.piadmin-hc button,
.piadmin-root.piadmin-hc input,
.piadmin-root.piadmin-hc select,
.piadmin-root.piadmin-hc textarea { border: 1px solid var(--border) !important; }
.piadmin-root.piadmin-hc a { color: var(--accent); text-decoration: underline; }
.piadmin-root.piadmin-hc .piadmin-tree-row:focus-within,
.piadmin-root.piadmin-hc .piadmin-tree-row:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.piadmin-root.piadmin-hc .piadmin-btn-primary { background: var(--accent); color: #000; border-color: var(--accent) !important; }
.piadmin-root.piadmin-hc .piadmin-btn-primary:hover { background: var(--accent-hover); }
.piadmin-root.piadmin-hc .piadmin-badge { border: 1px solid currentColor; }

/* ── Reset & base ── */
.piadmin-root { position:relative; width:100%; min-height:calc(100vh - 48px);
  font-family:var(--font); font-size:13px; color:var(--text); background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
.piadmin-root *, .piadmin-root *::before, .piadmin-root *::after { box-sizing:border-box; margin:0; padding:0; }
.piadmin-root button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
.piadmin-root input, .piadmin-root select, .piadmin-root textarea { font:inherit; color:var(--text); }

/* ── Header ── */
.piadmin-header { display:flex; align-items:center; justify-content:space-between;
  height:var(--header-h); padding:0 20px; background:var(--surface); border-bottom:1px solid var(--border);
  flex-shrink:0; }
.piadmin-header-left { display:flex; align-items:center; gap:12px; }
.piadmin-logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#0078d4,#50e6ff);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
.piadmin-title { font-size:16px; font-weight:600; }
.piadmin-header-actions { display:flex; align-items:center; gap:8px; }
.piadmin-search-box { position:relative; }
.piadmin-search-box input { width:240px; height:32px; padding:0 32px 0 10px; border:1px solid var(--border);
  border-radius:var(--radius); background:var(--surface-alt); outline:none; transition:border var(--transition); }
.piadmin-search-box input:focus { border-color:var(--accent); }
.piadmin-search-box .piadmin-search-icon { position:absolute; right:8px; top:50%; transform:translateY(-50%);
  color:var(--text-tertiary); pointer-events:none; font-size:14px; }
.piadmin-search-box .piadmin-search-clear { position:absolute; right:28px; top:50%; transform:translateY(-50%);
  color:var(--text-tertiary); font-size:16px; display:none; padding:2px 4px; line-height:1; }
.piadmin-search-box input:not(:placeholder-shown) ~ .piadmin-search-clear { display:block; }

/* ── Icon buttons ── */
.piadmin-icon-btn { width:32px; height:32px; border-radius:var(--radius); display:flex;
  align-items:center; justify-content:center; transition:background var(--transition); font-size:16px; }
.piadmin-icon-btn:hover { background:var(--surface-hover); }

/* ── Section Tabs ── */
.piadmin-tabs { display:flex; height:var(--tabs-h); padding:0 20px; background:var(--surface);
  border-bottom:1px solid var(--border); flex-shrink:0; gap:0; }
.piadmin-tab { padding:0 16px; height:100%; display:flex; align-items:center; font-size:13px;
  font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent;
  transition:all var(--transition); white-space:nowrap; }
.piadmin-tab:hover { color:var(--text); background:var(--surface-hover); }
.piadmin-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.piadmin-tab-badge { margin-left:6px; padding:0 6px; height:18px; border-radius:9px;
  background:var(--accent-light); color:var(--accent); font-size:11px; font-weight:600;
  display:flex; align-items:center; }

/* ── Toolbar ── */
.piadmin-toolbar { display:flex; align-items:center; padding:8px 20px; background:var(--surface-alt);
  border-bottom:1px solid var(--border-light); flex-shrink:0; gap:6px; flex-wrap:wrap; }
.piadmin-btn { height:30px; padding:0 12px; border-radius:var(--radius); font-size:12px; font-weight:500;
  display:inline-flex; align-items:center; gap:4px; transition:all var(--transition);
  border:1px solid var(--border); background:var(--surface); color:var(--text); }
.piadmin-btn:hover { background:var(--surface-hover); border-color:var(--text-tertiary); }
.piadmin-btn:disabled { opacity:.4; cursor:default; }
.piadmin-btn-primary { height:30px; padding:0 14px; border-radius:var(--radius); font-size:12px;
  font-weight:600; background:var(--accent); color:var(--accent-text); display:inline-flex;
  align-items:center; gap:4px; transition:all var(--transition); border:none; }
.piadmin-btn-primary:hover { background:var(--accent-hover); }
.piadmin-btn-primary:disabled { opacity:.5; cursor:default; }
.piadmin-btn-danger { background:var(--danger); color:#fff; border:none; }
.piadmin-btn-danger:hover { opacity:.9; }
.piadmin-toolbar-sep { width:1px; height:20px; background:var(--border); margin:0 4px; }
.piadmin-toolbar select { height:30px; padding:0 8px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); font-size:12px; }
.piadmin-toolbar-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.piadmin-item-count { font-size:11px; color:var(--text-tertiary); }

/* ── Main layout ── */
.piadmin-body { display:flex; flex:1; overflow:hidden; }
.piadmin-main { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }
.piadmin-section { display:none; }
.piadmin-section.active { display:contents; }

/* ── Breadcrumb bar ── */
.piadmin-breadcrumb { padding:6px 20px; background:var(--surface-alt); border-bottom:1px solid var(--border-light);
  font-size:12px; color:var(--text-secondary); display:none; flex-shrink:0; }
.piadmin-breadcrumb.visible { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.piadmin-breadcrumb-seg { cursor:pointer; color:var(--accent); }
.piadmin-breadcrumb-seg:hover { text-decoration:underline; }
.piadmin-breadcrumb-sep { color:var(--text-tertiary); }
.piadmin-breadcrumb-current { color:var(--text); font-weight:500; }

/* ── Tree View ── */
.piadmin-tree { padding:0; }
.piadmin-tree-empty { padding:40px 20px; text-align:center; color:var(--text-tertiary); }

/* Column header */
.piadmin-tree-header { display:flex; align-items:center; height:32px; padding:0 12px 0 0;
  background:var(--surface); border-bottom:2px solid var(--border); font-size:11px;
  font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.3px;
  position:sticky; top:0; z-index:10; user-select:none; flex-shrink:0; }
.piadmin-tree-header-name { flex:1; min-width:200px; display:flex; align-items:center;
  padding-left:12px; gap:6px; cursor:pointer; }
.piadmin-tree-header-url { width:var(--col-url, 280px); min-width:100px; flex-shrink:0;
  display:flex; align-items:center; gap:4px; padding:0 8px; cursor:pointer; }
.piadmin-tree-header-status { width:var(--col-status, 100px); flex-shrink:0;
  display:flex; align-items:center; gap:4px; padding:0 8px; cursor:pointer; }
.piadmin-tree-header-actions { width:84px; flex-shrink:0; }
.piadmin-sort-indicator { font-size:9px; opacity:.6; }
.piadmin-tree-header > div:hover { color:var(--text); }

/* Column resize handle */
.piadmin-col-resize { width:5px; cursor:col-resize; flex-shrink:0; align-self:stretch;
  position:relative; z-index:11; }
.piadmin-col-resize::after { content:''; position:absolute; top:4px; bottom:4px; left:2px;
  width:1px; background:var(--border); transition:background .15s; }
.piadmin-col-resize:hover::after { background:var(--accent); width:3px; left:1px; border-radius:2px; }

/* Select-all checkbox in header */
.piadmin-tree-header .piadmin-tree-check { width:16px; height:16px; margin-right:6px;
  flex-shrink:0; accent-color:var(--accent); cursor:pointer; }

/* Tree node row — grid approach via flex with matched column widths */
.piadmin-tree-row { display:flex; align-items:center; height:36px; padding-right:0;
  cursor:pointer; transition:background .1s; position:relative; user-select:none; }
.piadmin-tree-row:hover { background:var(--surface-hover); }
.piadmin-tree-row.selected { background:var(--accent-light); }
.piadmin-tree-row:nth-child(even of .piadmin-tree-row) { background:var(--surface-alt); }
.piadmin-tree-row:nth-child(even of .piadmin-tree-row):hover { background:var(--surface-hover); }
.piadmin-tree-row.saving::after { content:''; position:absolute; right:120px; top:50%;
  width:14px; height:14px; margin-top:-7px; border:2px solid var(--accent); border-top-color:transparent;
  border-radius:50%; animation:piadmin-spin .6s linear infinite; }

/* Name column (flex child) */
.piadmin-tree-col-name { flex:1; min-width:200px; display:flex; align-items:center;
  overflow:hidden; height:100%; }

/* URL column */
.piadmin-tree-col-url { width:var(--col-url, 280px); min-width:100px; flex-shrink:0;
  font-size:11px; color:var(--text-tertiary); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; padding:0 8px; display:flex; align-items:center; height:100%;
  border-left:1px solid var(--border-light); }

/* Status column */
.piadmin-tree-col-status { width:var(--col-status, 100px); flex-shrink:0;
  display:flex; align-items:center; gap:3px; padding:0 6px; height:100%;
  border-left:1px solid var(--border-light); flex-wrap:wrap; overflow:hidden; }

/* Actions column */
.piadmin-tree-col-actions { width:84px; flex-shrink:0; display:flex; align-items:center;
  gap:2px; justify-content:center; opacity:0; transition:opacity .15s; height:100%; }
.piadmin-tree-row:hover .piadmin-tree-col-actions { opacity:1; }

/* Indentation guides */
.piadmin-tree-row::before { content:''; position:absolute; top:0; bottom:0; width:1px;
  background:var(--border-light); pointer-events:none; }
.piadmin-tree-row[data-depth="0"]::before { display:none; }

/* Expand/collapse chevron */
.piadmin-tree-expand { width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; color:var(--text-tertiary); transition:transform .15s; font-size:10px; }
.piadmin-tree-expand.has-children { color:var(--text-secondary); }
.piadmin-tree-expand.expanded { transform:rotate(90deg); }
.piadmin-tree-expand:not(.has-children) { visibility:hidden; }

/* Checkbox */
.piadmin-tree-check { width:16px; height:16px; margin-right:6px; flex-shrink:0; accent-color:var(--accent); cursor:pointer; }

/* Node content */
.piadmin-tree-icon { font-size:14px; margin-right:4px; flex-shrink:0; width:20px; text-align:center; }
.piadmin-tree-title { font-size:13px; font-weight:400; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; min-width:0; }
.piadmin-tree-title mark { background:var(--warning-bg); border-radius:2px; padding:0 1px; }
.piadmin-tree-row.disabled-item .piadmin-tree-title { opacity:.5; text-decoration:line-through; }

/* Depth pill for capped indentation */
.piadmin-depth-pill { font-size:9px; padding:1px 5px; border-radius:8px; background:var(--surface-hover);
  color:var(--text-tertiary); font-weight:600; flex-shrink:0; margin-right:4px; line-height:1.3; }

/* Badges */
.piadmin-tree-badges { display:flex; gap:3px; flex-shrink:0; flex-wrap:wrap; }
.piadmin-badge { padding:0 5px; height:16px; border-radius:8px; font-size:9px; font-weight:600;
  display:flex; align-items:center; line-height:1; white-space:nowrap; }
.piadmin-badge-new { background:#fbbf24; color:#000; }
.piadmin-badge-disabled { background:var(--danger-bg); color:var(--danger); }
.piadmin-badge-audience { background:var(--accent-light); color:var(--accent); }
.piadmin-badge-header { background:var(--surface-hover); color:var(--text-secondary); }

/* URL display (now inside col-url) */
.piadmin-tree-url { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }

/* Action buttons (now inside col-actions) */
.piadmin-tree-action { width:26px; height:26px; border-radius:4px; display:flex;
  align-items:center; justify-content:center; font-size:13px; color:var(--text-secondary); }
.piadmin-tree-action:hover { background:var(--surface); color:var(--text); }
.piadmin-tree-action.danger:hover { color:var(--danger); }
.piadmin-tree-handle { cursor:grab; color:var(--text-tertiary); font-size:14px; }
.piadmin-tree-handle:active { cursor:grabbing; }

/* Drag indicators */
.piadmin-tree-row.drag-over-top { box-shadow:inset 0 2px 0 var(--accent); }
.piadmin-tree-row.drag-over-bottom { box-shadow:inset 0 -2px 0 var(--accent); }
.piadmin-tree-row.drag-over-child { background:var(--accent-light); }
.piadmin-tree-row.dragging { opacity:.4; }

/* Children container */
.piadmin-tree-children { overflow:hidden; }
.piadmin-tree-children.collapsed { display:none; }

/* ── Edit Panel (slide from right) ── */
.piadmin-panel-overlay { position:absolute; inset:0; background:rgba(0,0,0,.3); z-index:100;
  opacity:0; transition:opacity var(--transition); pointer-events:none; }
.piadmin-panel-overlay.visible { opacity:1; pointer-events:all; }

.piadmin-panel { position:absolute; top:0; right:0; bottom:0; width:420px; background:var(--surface);
  border-left:1px solid var(--border); box-shadow:var(--shadow-lg); z-index:101;
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .25s ease; }
.piadmin-panel.open { transform:translateX(0); }
.piadmin-panel-header { display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--border); }
.piadmin-panel-title { font-size:16px; font-weight:600; }
.piadmin-panel-close { width:32px; height:32px; font-size:20px; border-radius:var(--radius);
  display:flex; align-items:center; justify-content:center; }
.piadmin-panel-close:hover { background:var(--surface-hover); }
.piadmin-panel-body { flex:1; overflow-y:auto; padding:20px; }
.piadmin-panel-footer { display:flex; justify-content:flex-end; gap:8px; padding:16px 20px;
  border-top:1px solid var(--border); }

/* ── Form fields ── */
.piadmin-field { margin-bottom:16px; }
.piadmin-field label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary);
  margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.piadmin-field input[type="text"], .piadmin-field input[type="url"], .piadmin-field input[type="number"],
.piadmin-field select, .piadmin-field textarea { width:100%; height:34px; padding:0 10px;
  border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-alt);
  outline:none; transition:border var(--transition); }
.piadmin-field input:focus, .piadmin-field select:focus, .piadmin-field textarea:focus {
  border-color:var(--accent); }
.piadmin-field textarea { height:auto; min-height:60px; padding:8px 10px; resize:vertical; }
.piadmin-field select { cursor:pointer; }
.piadmin-field-hint { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
.piadmin-field-error { font-size:11px; color:var(--danger); margin-top:2px; }

/* Toggle */
.piadmin-toggle { display:flex; align-items:center; gap:8px; cursor:pointer; }
.piadmin-toggle input { display:none; }
.piadmin-toggle-track { width:36px; height:20px; border-radius:10px; background:var(--border);
  position:relative; transition:background var(--transition); flex-shrink:0; }
.piadmin-toggle input:checked ~ .piadmin-toggle-track { background:var(--accent); }
.piadmin-toggle-thumb { position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:#fff; transition:left var(--transition); box-shadow:0 1px 3px rgba(0,0,0,.2); }
.piadmin-toggle input:checked ~ .piadmin-toggle-track .piadmin-toggle-thumb { left:18px; }
.piadmin-toggle-label { font-size:13px; }

/* ── Confirmation Dialog ── */
.piadmin-dialog-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.4); z-index:200;
  display:none; align-items:center; justify-content:center; }
.piadmin-dialog-backdrop.visible { display:flex; }
.piadmin-dialog { background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  padding:24px; max-width:400px; width:90%; }
.piadmin-dialog h3 { font-size:16px; font-weight:600; margin-bottom:8px; }
.piadmin-dialog p { font-size:13px; color:var(--text-secondary); margin-bottom:16px; line-height:1.5; }
.piadmin-dialog-actions { display:flex; justify-content:flex-end; gap:8px; }

/* ── Toast notifications ── */
.piadmin-toasts { position:absolute; bottom:20px; right:20px; z-index:300;
  display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.piadmin-toast { padding:10px 16px; border-radius:var(--radius); font-size:13px; font-weight:500;
  box-shadow:var(--shadow-lg); pointer-events:all; display:flex; align-items:center; gap:8px;
  animation:piadmin-slide-in .3s ease; max-width:360px; }
.piadmin-toast.success { background:var(--success-bg); color:var(--success); }
.piadmin-toast.error { background:var(--danger-bg); color:var(--danger); }
.piadmin-toast.info { background:var(--accent-light); color:var(--accent); }

/* ── Preview Panel (resizable) ── */
.piadmin-preview { width:var(--preview-w, 320px); min-width:200px; max-width:50vw; border-left:1px solid var(--border);
  background:var(--surface); display:flex; flex-direction:column; flex-shrink:0; }
.piadmin-preview-resize { width:5px; cursor:col-resize; flex-shrink:0; align-self:stretch; position:relative; }
.piadmin-preview-resize::after { content:''; position:absolute; top:4px; bottom:4px; right:2px;
  width:1px; background:var(--border); transition:background .15s; }
.piadmin-preview-resize:hover::after { background:var(--accent); width:3px; right:1px; border-radius:2px; }
.piadmin-preview-header { display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; border-bottom:1px solid var(--border-light); font-size:12px;
  font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; }
.piadmin-preview-body { flex:1; overflow-y:auto; padding:12px; }

<!-- ══════════════════════════════════════════════════════
     JavaScript — single IIFE, vanilla JS, no build step
