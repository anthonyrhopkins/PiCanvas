      e.preventDefault(); dragging = true; startX = e.clientX; startW = panel.offsetWidth;
      document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var newW = Math.max(200, Math.min(window.innerWidth * 0.5, startW - (e.clientX - startX)));
      panel.style.width = newW + 'px';
      try { localStorage.setItem('piadmin_preview_w', newW); } catch(e2) {}
    });
    document.addEventListener('mouseup', function() {
      if (dragging) { dragging = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; }
    });
  })();

  // ═══════════════════════════════════════════════════
  // NEWS TAB — Card grid with CRUD for PiCanvasNews
  // ═══════════════════════════════════════════════════
  (function() {
    var NEWS_LIST = 'PiCanvasNews';
    var NEWS_FIELDS = 'Id,Title,NewsUrl,NewsContent,NewsSection,NewsSortOrder,NewsHoverText,NewsPublishedDate,NewsNewDays';
    var newsItems = [];
    var newsLoaded = false;

    function loadNews() {
      var main = document.getElementById('piadminNewsMain');
      var loading = document.getElementById('piadminNewsLoading');
      if (loading) loading.style.display = '';

      fetch(siteUrl + "/_api/web/lists/getbytitle('" + NEWS_LIST + "')/items?$select=" + NEWS_FIELDS + "&$orderby=NewsSortOrder,Id&$top=100", {
        headers: { 'Accept': 'application/json;odata=nometadata' }, credentials: 'same-origin'
      }).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) {
        newsItems = d.value || [];
        if (loading) loading.style.display = 'none';
        renderNewsCards();
        renderNewsPreview();
        document.getElementById('piadminNewsCount').textContent = newsItems.length + ' items';
      }).catch(function(err) {
        if (loading) loading.style.display = 'none';
        showToast('Failed to load news: ' + err.message, 'error');
      });
    }

    function renderNewsCards() {
      var main = document.getElementById('piadminNewsMain');
      var topNews = [], goodToKnow = [];
      for (var i = 0; i < newsItems.length; i++) {
        if (newsItems[i].NewsSection === 'Good to Know') goodToKnow.push(newsItems[i]);
        else topNews.push(newsItems[i]);
      }
      var html = '';
      if (topNews.length) {
        html += '<div class="piadmin-news-group"><div class="piadmin-news-group-title">Top News (' + topNews.length + ')</div>';
        html += '<div class="piadmin-news-cards" data-section="Top News">';
        for (var i = 0; i < topNews.length; i++) html += newsCardHtml(topNews[i]);
        html += '</div></div>';
      }
      if (goodToKnow.length) {
        html += '<div class="piadmin-news-group"><div class="piadmin-news-group-title">Good to Know (' + goodToKnow.length + ')</div>';
        html += '<div class="piadmin-news-cards" data-section="Good to Know">';
        for (var i = 0; i < goodToKnow.length; i++) html += newsCardHtml(goodToKnow[i]);
        html += '</div></div>';
      }
      if (!html) html = '<div class="piadmin-tree-empty">No news items found.</div>';
      // Keep loading element reference, replace only the cards area
      var existing = main.querySelector('.piadmin-news-content');
      if (existing) existing.innerHTML = html;
      else {
        var container = document.createElement('div');
        container.className = 'piadmin-news-content';
        container.innerHTML = html;
        main.appendChild(container);
      }
    }

    function newsCardHtml(item) {
      var isNew = false;
      if (item.NewsNewDays && item.NewsPublishedDate) {
        var pub = new Date(item.NewsPublishedDate);
        var diffDays = (Date.now() - pub.getTime()) / 86400000;
        isNew = diffDays <= item.NewsNewDays;
      }
      var secBadge = item.NewsSection === 'Good to Know'
        ? '<span class="piadmin-news-badge-section piadmin-news-badge-gtk">Good to Know</span>'
        : '<span class="piadmin-news-badge-section piadmin-news-badge-top">Top News</span>';
      var pubDate = item.NewsPublishedDate ? new Date(item.NewsPublishedDate).toLocaleDateString() : '';

      return '<div class="piadmin-news-card" data-id="' + item.Id + '" draggable="true">' +
        '<span class="piadmin-news-card-drag" title="Drag to reorder">&#9776;</span>' +
        '<div class="piadmin-news-card-body">' +
          '<div class="piadmin-news-card-title">' + esc(item.Title) + '</div>' +
          '<div class="piadmin-news-card-meta">' +
            (pubDate ? '<span>' + pubDate + '</span>' : '') +
            (item.NewsHoverText ? '<span>' + esc(item.NewsHoverText).substring(0, 40) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="piadmin-news-card-badges">' + secBadge + (isNew ? '<span class="piadmin-news-badge-new">NEW</span>' : '') + '</div>' +
        '<div class="piadmin-news-card-actions">' +
          '<button class="piadmin-tree-action" data-action="edit-news" data-id="' + item.Id + '" title="Edit">&#9998;</button>' +
          '<button class="piadmin-tree-action danger" data-action="delete-news" data-id="' + item.Id + '" title="Delete">&times;</button>' +
        '</div>' +
      '</div>';
    }

    function renderNewsPreview() {
      var preview = document.getElementById('piadminNewsPreview');
      if (!preview) return;
      var html = '';
      for (var i = 0; i < newsItems.length; i++) {
        var n = newsItems[i];
        html += '<div class="piadmin-news-preview-card">' +
          '<div class="piadmin-news-preview-title">' + esc(n.Title) + '</div>' +
          (n.NewsContent ? '<div class="piadmin-news-preview-snippet">' + esc(n.NewsContent).substring(0, 60) + '</div>' : '') +
        '</div>';
      }
      preview.innerHTML = html || '<div style="color:var(--text-tertiary);text-align:center;">No news items</div>';
    }

    function openNewsEditor(mode, item) {
      var val = item || { Title:'', NewsUrl:'', NewsContent:'', NewsSection:'Top News', NewsSortOrder:0, NewsHoverText:'', NewsPublishedDate:'', NewsNewDays:7 };
      var pubVal = val.NewsPublishedDate ? new Date(val.NewsPublishedDate).toISOString().split('T')[0] : '';

      document.getElementById('piadminPanelTitle').textContent = mode === 'create' ? 'Add News' : 'Edit News';
      var body = document.getElementById('piadminPanelBody');
      body.innerHTML =
        '<div class="piadmin-field"><label>Title *</label><input type="text" id="piadminNewsTitle" value="' + esc(val.Title) + '"></div>' +
        '<div class="piadmin-field"><label>URL</label><input type="url" id="piadminNewsUrl" value="' + esc(val.NewsUrl || '') + '" placeholder="https://..."></div>' +
        '<div class="piadmin-field"><label>Content</label><textarea id="piadminNewsContent" rows="3">' + esc(val.NewsContent || '') + '</textarea></div>' +
        '<div class="piadmin-field"><label>Section</label><select id="piadminNewsSection">' +
          '<option value="Top News"' + (val.NewsSection !== 'Good to Know' ? ' selected' : '') + '>Top News</option>' +
          '<option value="Good to Know"' + (val.NewsSection === 'Good to Know' ? ' selected' : '') + '>Good to Know</option></select></div>' +
        '<div class="piadmin-field"><label>Sort Order</label><input type="number" id="piadminNewsSortOrder" value="' + (val.NewsSortOrder || 0) + '"></div>' +
        '<div class="piadmin-field"><label>Hover Text</label><input type="text" id="piadminNewsHoverText" value="' + esc(val.NewsHoverText || '') + '"></div>' +
        '<div class="piadmin-field"><label>Published Date</label><input type="date" id="piadminNewsPubDate" value="' + pubVal + '"></div>' +
        '<div class="piadmin-field"><label>NEW Badge Days</label><input type="number" id="piadminNewsNewDays" value="' + (val.NewsNewDays || 7) + '">' +
          '<div class="piadmin-field-hint">Days from published date to show NEW badge</div></div>';

      document.getElementById('piadminPanel').classList.add('open');
      document.getElementById('piadminPanelOverlay').classList.add('visible');

      // Override save handler temporarily
      var saveBtn = document.getElementById('piadminPanelSave');
      var origClick = saveBtn.onclick;
      saveBtn.onclick = function() {
        var title = document.getElementById('piadminNewsTitle').value.trim();
        if (!title) { showToast('Title is required', 'error'); return; }
        var data = {
          Title: title,
          NewsUrl: document.getElementById('piadminNewsUrl').value.trim(),
          NewsContent: document.getElementById('piadminNewsContent').value,
          NewsSection: document.getElementById('piadminNewsSection').value,
          NewsSortOrder: parseInt(document.getElementById('piadminNewsSortOrder').value) || 0,
          NewsHoverText: document.getElementById('piadminNewsHoverText').value.trim(),
          NewsPublishedDate: document.getElementById('piadminNewsPubDate').value || null,
          NewsNewDays: parseInt(document.getElementById('piadminNewsNewDays').value) || 7
        };
        saveBtn.disabled = true; saveBtn.textContent = 'Saving...';
        var promise = mode === 'create'
          ? api.getDigest().then(function(d) {
              return fetch(siteUrl + "/_api/web/lists/getbytitle('" + NEWS_LIST + "')/items", {
                method:'POST', headers:{'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata','X-RequestDigest':d},
                credentials:'same-origin', body:JSON.stringify(data)
              });
            })
          : api.getDigest().then(function(d) {
              return fetch(siteUrl + "/_api/web/lists/getbytitle('" + NEWS_LIST + "')/items(" + item.Id + ")", {
                method:'POST', headers:{'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata',
                  'X-RequestDigest':d,'X-HTTP-Method':'MERGE','If-Match':'*'},
                credentials:'same-origin', body:JSON.stringify(data)
              });
            });
        promise.then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
          .then(function() {
            showToast(mode === 'create' ? 'News created' : 'News updated', 'success');
            editor.close(); saveBtn.onclick = origClick; loadNews();
          }).catch(function(err) { showToast('Save failed: ' + err.message, 'error'); })
          .finally(function() { saveBtn.disabled = false; saveBtn.textContent = 'Save'; });
      };
    }

    function deleteNewsItem(item) {
      var dialog = document.getElementById('piadminDialog');
      dialog.innerHTML = '<h3>Delete News</h3><p>Delete <strong>' + esc(item.Title) + '</strong>?</p>' +
        '<div class="piadmin-dialog-actions"><button class="piadmin-btn" id="piadminDialogCancel">Cancel</button>' +
        '<button class="piadmin-btn-primary piadmin-btn-danger" id="piadminDialogConfirm">Delete</button></div>';
      document.getElementById('piadminDialogBackdrop').classList.add('visible');
      document.getElementById('piadminDialogCancel').onclick = function() {
        document.getElementById('piadminDialogBackdrop').classList.remove('visible');
      };
      document.getElementById('piadminDialogConfirm').onclick = function() {
        this.disabled = true; this.textContent = 'Deleting...';
        api.getDigest().then(function(d) {
          return fetch(siteUrl + "/_api/web/lists/getbytitle('" + NEWS_LIST + "')/items(" + item.Id + ")", {
            method:'POST', headers:{'Accept':'application/json;odata=nometadata','X-RequestDigest':d,'X-HTTP-Method':'DELETE','If-Match':'*'},
            credentials:'same-origin'
          });
        }).then(function() {
          document.getElementById('piadminDialogBackdrop').classList.remove('visible');
          showToast('Deleted: ' + item.Title, 'success'); loadNews();
        }).catch(function(err) {
          document.getElementById('piadminDialogBackdrop').classList.remove('visible');
          showToast('Delete failed: ' + err.message, 'error');
        });
      };
    }

    // Event delegation for news cards
    document.getElementById('piadminNewsMain').addEventListener('click', function(e) {
      var btn = e.target.closest('.piadmin-tree-action');
      if (!btn) return;
      var action = btn.getAttribute('data-action');
      var id = parseInt(btn.getAttribute('data-id'));
      var item = null;
      for (var i = 0; i < newsItems.length; i++) { if (newsItems[i].Id === id) { item = newsItems[i]; break; } }
      if (!item) return;
      if (action === 'edit-news') openNewsEditor('edit', item);
      else if (action === 'delete-news') deleteNewsItem(item);
    });

    document.getElementById('piadminNewsAdd').addEventListener('click', function() { openNewsEditor('create', null); });

    // Lazy load news on first tab switch
    var newsTab = root.querySelector('.piadmin-tab[data-section="news"]');
    if (newsTab) newsTab.addEventListener('click', function() { if (!newsLoaded) { newsLoaded = true; loadNews(); } });
  })();

  // ═══════════════════════════════════════════════════
  // SHORTCUTS TAB — Admin table of all user shortcuts
  // ═══════════════════════════════════════════════════
  (function() {
    var SC_LIST = 'PiCanvasUserShortcuts';
    var scItems = [];
    var scLoaded = false;
    var scSortCol = '', scSortDir = 'asc';

    function loadShortcuts() {
      fetch(siteUrl + "/_api/web/lists/getbytitle('" + SC_LIST + "')/items?$select=Id,Title,ShortcutUrl,ShortcutIcon,SortOrder,OpenInNewWindow,Author/Title&$expand=Author&$orderby=Id&$top=500", {
        headers: { 'Accept': 'application/json;odata=nometadata' }, credentials: 'same-origin'
      }).then(function(r) {
        if (!r.ok) {
          if (r.status === 404) { scItems = []; renderShortcuts(); renderScStats(); return; }
          throw new Error('HTTP ' + r.status);
        }
        return r.json();
      }).then(function(d) {
        if (!d) return;
        scItems = d.value || [];
        renderShortcuts();
        renderScStats();
        document.getElementById('piadminShortcutsCount').textContent = scItems.length + ' shortcuts';
      }).catch(function(err) {
        showToast('Failed to load shortcuts: ' + err.message, 'error');
        document.getElementById('piadminShortcutsBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-tertiary);">Could not load shortcuts. The list may not exist yet.</td></tr>';
      });
    }

    function renderScStats() {
      var stats = document.getElementById('piadminShortcutsStats');
      var users = {};
      for (var i = 0; i < scItems.length; i++) {
        var author = scItems[i].Author ? scItems[i].Author.Title : 'Unknown';
        users[author] = (users[author] || 0) + 1;
      }
      var uniqueUsers = Object.keys(users).length;
      stats.innerHTML =
        '<div class="piadmin-stat-card"><span class="piadmin-stat-value">' + scItems.length + '</span><span class="piadmin-stat-label">Total Shortcuts</span></div>' +
        '<div class="piadmin-stat-card"><span class="piadmin-stat-value">' + uniqueUsers + '</span><span class="piadmin-stat-label">Unique Users</span></div>';
    }

    function renderShortcuts(filter) {
      var tbody = document.getElementById('piadminShortcutsBody');
      var filtered = scItems;
      if (filter) {
        var q = filter.toLowerCase();
        filtered = scItems.filter(function(s) {
          return (s.Title && s.Title.toLowerCase().indexOf(q) > -1) ||
            (s.ShortcutUrl && s.ShortcutUrl.toLowerCase().indexOf(q) > -1) ||
            (s.Author && s.Author.Title && s.Author.Title.toLowerCase().indexOf(q) > -1);
        });
      }
      if (scSortCol) {
        var dir = scSortDir === 'desc' ? -1 : 1;
        filtered.sort(function(a, b) {
          var va, vb;
          if (scSortCol === 'title') { va = (a.Title || '').toLowerCase(); vb = (b.Title || '').toLowerCase(); }
          else if (scSortCol === 'url') { va = (a.ShortcutUrl || '').toLowerCase(); vb = (b.ShortcutUrl || '').toLowerCase(); }
          else if (scSortCol === 'user') { va = (a.Author ? a.Author.Title : '').toLowerCase(); vb = (b.Author ? b.Author.Title : '').toLowerCase(); }
          else if (scSortCol === 'created') { va = a.Id; vb = b.Id; }
          else return 0;
          return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
        });
      }
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-tertiary);">' +
          (filter ? 'No shortcuts match the search' : 'No user shortcuts found') + '</td></tr>';
        return;
      }
      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var s = filtered[i];
        html += '<tr>' +
          '<td class="sc-icon">' + esc(s.ShortcutIcon || '\u2605') + '</td>' +
          '<td>' + esc(s.Title) + '</td>' +
          '<td class="sc-url" title="' + esc(s.ShortcutUrl) + '">' + esc(truncUrl(s.ShortcutUrl)) + '</td>' +
          '<td class="sc-user">' + esc(s.Author ? s.Author.Title : 'Unknown') + '</td>' +
          '<td>' + s.Id + '</td>' +
        '</tr>';
      }
      tbody.innerHTML = html;
    }

    // Search
    document.getElementById('piadminShortcutsSearch').addEventListener('input', function() {
      renderShortcuts(this.value);
    });

    // Column sorting
    document.getElementById('piadminShortcutsTable').querySelector('thead').addEventListener('click', function(e) {
      var th = e.target.closest('th[data-sort]');
      if (!th) return;
      var col = th.getAttribute('data-sort');
      if (scSortCol === col) scSortDir = scSortDir === 'asc' ? 'desc' : 'asc';
      else { scSortCol = col; scSortDir = 'asc'; }
      // Update indicators
      var ths = this.querySelectorAll('th[data-sort]');
      for (var i = 0; i < ths.length; i++) {
        var ind = ths[i].querySelector('.piadmin-sort-indicator');
        if (ind) ind.textContent = ths[i].getAttribute('data-sort') === scSortCol ? (scSortDir === 'asc' ? '\u25B2' : '\u25BC') : '';
      }
      renderShortcuts(document.getElementById('piadminShortcutsSearch').value);
    });

    // Lazy load on tab click
    var scTab = root.querySelector('.piadmin-tab[data-section="shortcuts"]');
    if (scTab) scTab.addEventListener('click', function() { if (!scLoaded) { scLoaded = true; loadShortcuts(); } });
  })();

            if (!Array.isArray(items)) throw new Error('Expected JSON array');
            var dialog = document.getElementById('piadminDialog');
            dialog.innerHTML = '<h3>Import Navigation</h3><p>Import <strong>' + items.length + '</strong> items? Existing items with the same ID will be updated, new items will be created.</p>' +
              '<div class="piadmin-dialog-actions"><button class="piadmin-btn" id="piadminDialogCancel">Cancel</button>' +
              '<button class="piadmin-btn-primary" id="piadminDialogConfirm">Import</button></div>';
            document.getElementById('piadminDialogBackdrop').classList.add('visible');
            document.getElementById('piadminDialogCancel').onclick = function() {
              document.getElementById('piadminDialogBackdrop').classList.remove('visible');
            };
            document.getElementById('piadminDialogConfirm').onclick = function() {
              this.disabled = true; this.textContent = 'Importing...';
              var chain = Promise.resolve();
              var created = 0;
              items.forEach(function(item) {
                var data = { Title: item.Title, NavUrl: item.NavUrl, ParentId0: item.ParentId0 || 0,
                  SortOrder: item.SortOrder || 0, IsNew: !!item.IsNew, Icon: item.Icon || '',
                  IsEnabled: item.IsEnabled !== false, OpenInNewWindow: item.OpenInNewWindow !== false,
                  Audience: item.Audience || '' };
                chain = chain.then(function() { return api.createItem(data).then(function() { created++; }); });
              });
              chain.then(function() {
                document.getElementById('piadminDialogBackdrop').classList.remove('visible');
                showToast('Imported ' + created + ' items', 'success');
                loadData();
              }).catch(function(err) {
                document.getElementById('piadminDialogBackdrop').classList.remove('visible');
                showToast('Import failed: ' + err.message, 'error');
              });
            };
          } catch(err) { showToast('Invalid JSON: ' + err.message, 'error'); }
        };
        reader.readAsText(file);
        this.value = ''; // reset file input
      });

      // Reset columns
      document.getElementById('piadminResetColumns').addEventListener('click', function() {
        try { localStorage.removeItem('piadmin_col_url'); localStorage.removeItem('piadmin_col_status'); localStorage.removeItem('piadmin_preview_w'); } catch(e) {}
        var tc = document.getElementById('piadminTree');
        if (tc) { tc.style.removeProperty('--col-url'); tc.style.removeProperty('--col-status'); }
        var pp = document.getElementById('piadminPreviewPanel');
        if (pp) pp.style.width = '';
        showToast('Column widths reset', 'info');
      });

      // Clear expanded
      document.getElementById('piadminClearExpanded').addEventListener('click', function() {
        try { sessionStorage.removeItem('piadmin_expanded'); } catch(e) {}
        if (tree) { tree._expanded = {}; tree.render(); }
        showToast('Expanded state cleared', 'info');
      });

      // ── Version History: load snapshot versions from Site Assets ──
      function loadSnapshotVersions() {
        var listEl = document.getElementById('piadminSnapshotList');
        if (!listEl) return;
        api.getSnapshotVersions().then(function(versions) {
          if (!versions.length) {
            listEl.innerHTML = '<em style="font-size:11px;color:var(--text-tertiary);">No snapshots yet. Snapshots are created automatically before each save.</em>';
            return;
          }
          var html = '<table class="piadmin-snapshot-table"><thead><tr>' +
            '<th>Version</th><th>Date</th><th>By</th><th></th></tr></thead><tbody>';
          for (var i = 0; i < versions.length; i++) {
            var v = versions[i];
            var created = v.Created ? new Date(v.Created).toLocaleString() : '';
            var by = v.CreatedBy ? (v.CreatedBy.Title || '') : '';
            html += '<tr>' +
              '<td>' + esc(v.VersionLabel || '') + '</td>' +
              '<td>' + esc(created) + '</td>' +
              '<td>' + esc(by) + '</td>' +
              '<td style="text-align:right;">' +
                '<button class="piadmin-btn" data-snapshot-action="preview" data-version-id="' + v.VersionId + '" style="height:22px;font-size:10px;margin-right:4px;">Preview</button>' +
                '<button class="piadmin-btn" data-snapshot-action="restore" data-version-id="' + v.VersionId + '" data-version-label="' + esc(v.VersionLabel || '') + '" style="height:22px;font-size:10px;">Restore</button>' +
              '</td></tr>';
          }
          html += '</tbody></table>';
          listEl.innerHTML = html;
        }).catch(function(err) {
          listEl.innerHTML = '<em style="font-size:11px;color:var(--text-tertiary);">Could not load version history: ' + esc(err.message) + '</em>';
        });
      }
      loadSnapshotVersions();

      // Snapshot Now button
      document.getElementById('piadminSnapshotNow').addEventListener('click', function() {
        this.disabled = true; this.textContent = 'Saving...';
        var btn = this;
        api.getItems().then(function(items) {
          return api.uploadSnapshot(JSON.stringify(items, null, 2));
        }).then(function() {
          btn.disabled = false; btn.innerHTML = '&#128247; Create Snapshot Now';
          showToast('Snapshot saved to Site Assets', 'success');
          loadSnapshotVersions();
        }).catch(function(err) {
          btn.disabled = false; btn.innerHTML = '&#128247; Create Snapshot Now';
          showToast('Snapshot failed: ' + err.message, 'error');
        });
      });

      // Version history click handlers (preview & restore)
      document.getElementById('piadminSnapshotList').addEventListener('click', function(e) {
        var btn = e.target.closest('button[data-snapshot-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-snapshot-action');
        var versionId = btn.getAttribute('data-version-id');

        if (action === 'preview') {
          btn.disabled = true; btn.textContent = 'Loading...';
          api.getSnapshotVersionContent(versionId).then(function(items) {
            btn.disabled = false; btn.textContent = 'Preview';
            if (!Array.isArray(items)) { showToast('Invalid snapshot data', 'error'); return; }
            // Show preview in dialog
            var dialog = document.getElementById('piadminDialog');
            var html = '<h3>Snapshot Preview (' + items.length + ' items)</h3>' +
              '<div style="max-height:60vh;overflow-y:auto;font-size:11px;">';
            // Build simple tree display
            var map = {}, roots = [];
            for (var i = 0; i < items.length; i++) map[items[i].Id] = items[i];
            for (var i = 0; i < items.length; i++) {
              var it = items[i];
              if (!it.ParentId0 || it.ParentId0 === 0 || !map[it.ParentId0]) roots.push(it);
            }
            function renderSnapshotTree(nodes, depth) {
              var out = '';
              for (var n = 0; n < nodes.length; n++) {
                var node = nodes[n];
                var indent = '';
                for (var d = 0; d < depth; d++) indent += '&nbsp;&nbsp;&nbsp;&nbsp;';
                var enabled = node.IsEnabled !== false ? '' : ' style="opacity:.4;text-decoration:line-through;"';
                out += '<div' + enabled + '>' + indent + (node.Icon ? esc(node.Icon) + ' ' : '') +
                  '<strong>' + esc(node.Title) + '</strong>' +
                  (node.NavUrl && node.NavUrl !== '#' ? ' <small style="color:var(--text-tertiary);">' + esc(node.NavUrl) + '</small>' : '') +
                  '</div>';
                // Find children
                var children = [];
                for (var c = 0; c < items.length; c++) {
                  if (items[c].ParentId0 === node.Id) children.push(items[c]);
                }
                children.sort(function(a, b) { return (a.SortOrder || 0) - (b.SortOrder || 0); });
                out += renderSnapshotTree(children, depth + 1);
              }
              return out;
            }
            roots.sort(function(a, b) { return (a.SortOrder || 0) - (b.SortOrder || 0); });
            html += renderSnapshotTree(roots, 0);
            html += '</div><div class="piadmin-dialog-actions" style="margin-top:12px;">' +
              '<button class="piadmin-btn" id="piadminDialogCancel">Close</button></div>';
            dialog.innerHTML = html;
            document.getElementById('piadminDialogBackdrop').classList.add('visible');
            document.getElementById('piadminDialogCancel').onclick = function() {
              document.getElementById('piadminDialogBackdrop').classList.remove('visible');
            };
          }).catch(function(err) {
            btn.disabled = false; btn.textContent = 'Preview';
            showToast('Could not load snapshot: ' + err.message, 'error');
          });
        }

        if (action === 'restore') {
          var versionLabel = btn.getAttribute('data-version-label') || versionId;
          var dialog = document.getElementById('piadminDialog');
          dialog.innerHTML = '<h3>Restore Snapshot</h3>' +
            '<p>This will <strong>replace all current navigation items</strong> with the snapshot from version <strong>' + esc(versionLabel) + '</strong>.</p>' +
            '<p style="color:var(--danger);font-size:12px;">A new snapshot of the current state will be created first as a safety net.</p>' +
            '<p>Type <strong>RESTORE</strong> to confirm:</p>' +
            '<input type="text" class="piadmin-challenge-input" id="piadminRestoreChallenge" placeholder="Type RESTORE" style="width:120px;">' +
            '<div class="piadmin-dialog-actions" style="margin-top:12px;">' +
            '<button class="piadmin-btn" id="piadminDialogCancel">Cancel</button>' +
            '<button class="piadmin-btn-primary piadmin-btn-danger" id="piadminDialogConfirm" disabled>Restore</button></div>';
          document.getElementById('piadminDialogBackdrop').classList.add('visible');
          document.getElementById('piadminRestoreChallenge').addEventListener('input', function() {
            document.getElementById('piadminDialogConfirm').disabled = this.value.trim() !== 'RESTORE';
          });
          document.getElementById('piadminDialogCancel').onclick = function() {
            document.getElementById('piadminDialogBackdrop').classList.remove('visible');
          };
          document.getElementById('piadminDialogConfirm').onclick = function() {
            if (this.disabled) return;
            this.disabled = true; this.textContent = 'Restoring...';
            // 1. Create safety snapshot of current state
            // 2. Fetch snapshot version content
            // 3. Delete all current items, create all snapshot items
            api.getItems().then(function(currentItems) {
              return api.uploadSnapshot(JSON.stringify(currentItems, null, 2)).catch(function() {})
                .then(function() { return api.getSnapshotVersionContent(versionId); })
                .then(function(snapshotItems) {
                  if (!Array.isArray(snapshotItems)) throw new Error('Invalid snapshot data');
                  var total = currentItems.length + snapshotItems.length;
                  var done = 0;
                  dialog.innerHTML = '<h3>Restoring Snapshot</h3>' +
                    '<p>Step <span id="piadminRestoreProgress">0</span> of <strong>' + total + '</strong>...</p>' +
                    '<div class="piadmin-save-progress"><div class="piadmin-save-progress-bar" id="piadminRestoreBar" style="width:0%"></div></div>';
                  function updateRestoreProgress() {
                    done++;
                    var el = document.getElementById('piadminRestoreProgress');
                    if (el) el.textContent = done;
                    var bar = document.getElementById('piadminRestoreBar');
                    if (bar) bar.style.width = Math.round(done / total * 100) + '%';
                  }
                  // Delete all current items
                  var chain = Promise.resolve();
                  currentItems.forEach(function(item) {
                    chain = chain.then(function() {
                      return api.deleteItem(item.Id).then(updateRestoreProgress);
                    });
                  });
                  // Create all snapshot items (sorted: parents first)
                  snapshotItems.sort(function(a, b) {
                    var aDepth = a.ParentId0 && a.ParentId0 !== 0 ? 1 : 0;
                    var bDepth = b.ParentId0 && b.ParentId0 !== 0 ? 1 : 0;
                    return aDepth - bDepth;
                  });
                  var idMap = {};
                  snapshotItems.forEach(function(item) {
                    chain = chain.then(function() {
                      var data = {
                        Title: item.Title, NavUrl: item.NavUrl || '#',
                        ParentId0: item.ParentId0 && idMap[item.ParentId0] ? idMap[item.ParentId0] : (item.ParentId0 || 0),
                        SortOrder: item.SortOrder || 0, IsNew: !!item.IsNew,
                        Icon: item.Icon || '', IsEnabled: item.IsEnabled !== false,
                        OpenInNewWindow: item.OpenInNewWindow !== false,
                        Audience: item.Audience || ''
                      };
                      return api.createItem(data).then(function(created) {
                        idMap[item.Id] = created.Id;
                        updateRestoreProgress();
                      });
                    });
                  });
                  return chain;
                });
            }).then(function() {
              document.getElementById('piadminDialogBackdrop').classList.remove('visible');
              showToast('Snapshot restored successfully', 'success');
              loadData();
            }).catch(function(err) {
              document.getElementById('piadminDialogBackdrop').classList.remove('visible');
              showToast('Restore failed: ' + err.message + '. Reloading...', 'error');
              loadData();
            });
          };
        }
      });

      // Renumber sort order
      document.getElementById('piadminResetSort').addEventListener('click', function() {
        var dialog = document.getElementById('piadminDialog');
        dialog.innerHTML = '<h3>Renumber Sort Order</h3><p>This will set SortOrder to 0, 1, 2... for all items grouped by parent. Continue?</p>' +
          '<div class="piadmin-dialog-actions"><button class="piadmin-btn" id="piadminDialogCancel">Cancel</button>' +
          '<button class="piadmin-btn-primary piadmin-btn-danger" id="piadminDialogConfirm">Renumber</button></div>';
        document.getElementById('piadminDialogBackdrop').classList.add('visible');
        document.getElementById('piadminDialogCancel').onclick = function() {
          document.getElementById('piadminDialogBackdrop').classList.remove('visible');
        };
        document.getElementById('piadminDialogConfirm').onclick = function() {
          this.disabled = true; this.textContent = 'Working...';
          api.getItems().then(function(items) {
            var groups = {};
            items.forEach(function(item) {
              var pid = item.ParentId0 || 0;
              if (!groups[pid]) groups[pid] = [];
              groups[pid].push(item);
            });
            var chain = Promise.resolve();
            var count = 0;
            Object.keys(groups).forEach(function(pid) {
              groups[pid].forEach(function(item, idx) {
                if (item.SortOrder !== idx) {
                  chain = chain.then(function() { return api.updateItem(item.Id, { SortOrder: idx }).then(function() { count++; }); });
                }
              });
            });
            return chain.then(function() { return count; });
          }).then(function(count) {
            document.getElementById('piadminDialogBackdrop').classList.remove('visible');
            showToast('Renumbered ' + count + ' items', 'success');
            loadData();
          }).catch(function(err) {
            document.getElementById('piadminDialogBackdrop').classList.remove('visible');
            showToast('Renumber failed: ' + err.message, 'error');
          });
        };
      });
    }

    // Lazy load
    var settingsTab = root.querySelector('.piadmin-tab[data-section="settings"]');
    if (settingsTab) settingsTab.addEventListener('click', function() { if (!settingsLoaded) { settingsLoaded = true; renderSettings(); } });
  })();

})();
</script>
