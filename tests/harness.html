<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiCanvas Config Panel Test Harness</title>
  <link rel="stylesheet" href="../src/webparts/piCanvas/configPanel/ConfigurationPanel.css">
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #harness-controls { padding: 20px; }
    #harness-controls button {
      padding: 10px 24px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #harness-controls button:hover { background: #106ebe; }
    #status { padding: 10px 20px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div id="harness-controls">
    <button id="open-btn">Open Configuration Panel</button>
  </div>
  <div id="status">Panel: closed</div>

  <script src="dist/harness.js"></script>
  <script>
    document.getElementById('open-btn').addEventListener('click', () => {
      window.__picanvas.openPanel();
      document.getElementById('status').textContent = 'Panel: open';
    });
  </script>
</body>
</html>
